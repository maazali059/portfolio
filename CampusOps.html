<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusOps — Campus Space Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --border:#E4E7EC;
  --border-strong:#D0D5DD;
  --text:#101828;
  --text-2:#475467;
  --text-3:#98A2B3;
  --blue:#2952CC;
  --blue-dark:#1F3FA3;
  --blue-light:#EEF2FF;
  --blue-line:#C7D2FE;
  --red:#D92D20;
  --red-light:#FEF3F2;
  --red-line:#FECDCA;
  --amber:#B54708;
  --amber-light:#FFFAEB;
  --amber-line:#FEDF89;
  --green:#067647;
  --green-light:#ECFDF3;
  --green-line:#ABEFC6;
  --grey-chip:#F2F4F7;
  --radius:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--blue-line);}

#app{min-height:100vh;display:flex;flex-direction:column;}

/* ===== Topbar ===== */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:20px;
  padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.02em;flex:0 0 auto;}
.logo .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;}
.mode-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:100px;letter-spacing:.03em;text-transform:uppercase;}
.mode-badge.planning{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-line);}
.mode-badge.operations{background:var(--green-light);color:var(--green);border:1px solid var(--green-line);}

.topnav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;}
.topnav button{
  background:transparent;border:none;color:var(--text-2);font-size:13px;font-weight:600;
  padding:8px 12px;border-radius:8px;white-space:nowrap;transition:background .12s,color .12s;
}
.topnav button:hover{background:var(--grey-chip);color:var(--text);}
.topnav button.active{background:var(--blue-light);color:var(--blue);}

.search-wrap{position:relative;flex:0 0 260px;}
.search-wrap input{
  width:100%;padding:7px 10px 7px 30px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);font-size:12.5px;color:var(--text);
}
.search-wrap input:focus{outline:2px solid var(--blue-line);background:var(--surface);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:12px;}
.search-results{
  position:absolute;top:36px;left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg);max-height:280px;overflow:auto;z-index:60;
}
.search-row{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);}
.search-row:last-child{border-bottom:none;}
.search-row:hover{background:var(--blue-light);}
.search-empty{padding:14px;color:var(--text-3);font-size:12.5px;text-align:center;}

.persona-switcher{position:relative;flex:0 0 auto;}
.persona-btn{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  padding:5px 10px 5px 6px;border-radius:100px;font-size:12.5px;font-weight:600;
}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.persona-menu{
  position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg);width:230px;padding:6px;z-index:60;
}
.persona-menu .label{font-size:11px;color:var(--text-3);padding:6px 8px 2px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.persona-opt{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;font-size:13px;font-weight:600;}
.persona-opt:hover{background:var(--grey-chip);}
.persona-opt.active{background:var(--blue-light);color:var(--blue);}

.bell{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;}
.bell:disabled{opacity:.35;cursor:not-allowed;}
.bell:disabled:hover{background:var(--surface);}
.bell .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ===== Layout ===== */
.body-wrap{flex:1;display:flex;min-height:0;}
.main{flex:1;padding:24px 28px 90px;max-width:1360px;margin:0 auto;width:100%;}
.crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:8px;font-weight:600;}
.crumbs span.cur{color:var(--text-2);}
.crumbs a:hover{color:var(--blue);}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;}
.page-sub{color:var(--text-2);font-size:13px;margin:0;}
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  transition:all .12s;
}
.btn:hover{background:var(--grey-chip);}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn.primary:hover{background:var(--blue-dark);}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn.danger:hover{background:#B42318;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--grey-chip);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{background:var(--surface);}

/* ===== Cards / Grid ===== */
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px;}
.stat-card{padding:16px 18px;}
.stat-card .stat-label{font-size:12px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.stat-card .stat-value{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.stat-card .stat-value.red{color:var(--red);}
.stat-card .stat-value.amber{color:var(--amber);}
.stat-card .stat-value.green{color:var(--green);}
.stat-card .stat-foot{font-size:11.5px;color:var(--text-3);margin-top:4px;}

.section-title{font-size:14px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .hint{font-size:11.5px;font-weight:600;color:var(--text-3);}

/* building tile */
.tile{padding:16px;cursor:pointer;transition:box-shadow .12s,border-color .12s;}
.tile:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong);}
.tile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.tile-name{font-weight:700;font-size:14px;}
.tile-meta{font-size:12px;color:var(--text-2);}
.occ-bar{height:6px;background:var(--grey-chip);border-radius:100px;overflow:hidden;margin-top:10px;}
.occ-bar .fill{height:100%;background:var(--blue);border-radius:100px;}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.chip.blue{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-line);}
.chip.red{background:var(--red-light);color:var(--red);border:1px solid var(--red-line);}
.chip.amber{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-line);}
.chip.green{background:var(--green-light);color:var(--green);border:1px solid var(--green-line);}
.chip.grey{background:var(--grey-chip);color:var(--text-2);border:1px solid var(--border);}
.dot-ind{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* priority pill */
.pri{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em;}
.pri.P0{background:#7A271A;color:#fff;}
.pri.P1{background:var(--red);color:#fff;}
.pri.P2{background:var(--amber);color:#fff;}
.pri.P3{background:#6941C6;color:#fff;}
.pri.P4{background:var(--text-3);color:#fff;}

/* table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);
  font-weight:700;padding:10px 16px;border-bottom:1px solid var(--border);background:#FAFBFC;
}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;transition:background .1s;}
tbody tr.clickable:hover{background:var(--blue-light);}
.cell-strong{font-weight:700;}
.cell-muted{color:var(--text-3);}
.group-row td{background:#FAFBFC;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:8px 16px;}

/* conflict card list */
.conflict-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);}
.conflict-item:last-child{border-bottom:none;}
.conflict-main{flex:1;min-width:0;}
.conflict-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.conflict-sub{color:var(--text-2);font-size:12.5px;}

/* form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text-2);}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue-line);border-color:var(--blue);}
.checkrow{display:flex;gap:18px;}
.checkitem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}

/* stepper */
.stepper{display:flex;align-items:center;gap:0;margin:14px 0 6px;}
.stepper .step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.stepper .step .dotc{width:26px;height:26px;border-radius:50%;background:var(--grey-chip);color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid var(--border);z-index:1;}
.stepper .step.done .dotc{background:var(--green);border-color:var(--green);color:#fff;}
.stepper .step.active .dotc{background:var(--blue);border-color:var(--blue);color:#fff;}
.stepper .step .lbl{font-size:11px;margin-top:6px;color:var(--text-2);font-weight:700;text-align:center;}
.stepper .step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--border);}
.stepper .step.done:not(:last-child)::after{background:var(--green);}

/* pipeline processing */
.pipe-item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;font-weight:600;color:var(--text-3);}
.pipe-item.done{color:var(--text);}
.pipe-item .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;}
.pipe-item.done .ic{background:var(--green);border-color:var(--green);color:#fff;}
.pipe-item.spin .ic{border-top-color:var(--blue);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* dropzone */
.dropzone{
  border:2px dashed var(--border-strong);border-radius:14px;padding:46px 20px;text-align:center;background:#FAFBFC;
  transition:border-color .15s,background .15s;
}
.dropzone.hover{border-color:var(--blue);background:var(--blue-light);}
.dropzone .icon{font-size:34px;margin-bottom:10px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);max-height:88vh;overflow:auto;}
.modal.wide{max-width:640px;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:15px;font-weight:800;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:18px;color:var(--text-3);line-height:1;padding:4px;}

.room-suggest{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;}
.room-suggest .rname{font-weight:700;font-size:13.5px;}
.room-suggest .rmeta{font-size:12px;color:var(--text-2);margin-top:2px;}

/* toasts */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;width:320px;}
.toast{background:var(--text);color:#fff;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;animation:toastin .18s ease-out;}
.toast .ic{flex:0 0 auto;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* walkthrough panel */
.wt-fab{position:fixed;left:20px;bottom:20px;z-index:90;background:var(--text);color:#fff;border:none;border-radius:100px;padding:11px 16px;font-weight:700;font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;}
.wt-panel{position:fixed;left:20px;bottom:20px;z-index:90;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);max-height:70vh;display:flex;flex-direction:column;}
.wt-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.wt-head b{font-size:13px;}
.wt-progress{height:4px;background:var(--grey-chip);}
.wt-progress .fill{height:100%;background:var(--blue);}
.wt-list{overflow:auto;padding:8px;flex:1;}
.wt-item{display:flex;gap:8px;padding:7px 8px;border-radius:8px;font-size:12px;}
.wt-item.active{background:var(--blue-light);}
.wt-item .n{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--text-3);margin-top:1px;}
.wt-item.done .n{background:var(--green);border-color:var(--green);color:#fff;}
.wt-item.active .n{border-color:var(--blue);color:var(--blue);}
.wt-item span.t{color:var(--text-2);font-weight:600;}
.wt-item.done span.t{color:var(--text-3);text-decoration:line-through;}
.wt-item.active span.t{color:var(--text);font-weight:700;}
.wt-foot{padding:10px 14px;border-top:1px solid var(--border);}

/* ===== Guided Product Tour ===== */
#tourRoot{position:fixed;inset:0;z-index:500;pointer-events:none;}
.tour-overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);pointer-events:auto;transition:opacity .2s ease;}
.tour-spotlight{
  position:fixed;pointer-events:auto;border-radius:12px;
  box-shadow:0 0 0 4000px rgba(16,24,40,.55), 0 0 0 3px var(--blue), 0 0 24px 2px rgba(41,82,204,.55);
  background:rgba(255,255,255,.03);
  transition:top .28s cubic-bezier(.4,0,.2,1), left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1), height .28s cubic-bezier(.4,0,.2,1);
  z-index:1;
}
.tour-card{
  position:fixed;pointer-events:auto;width:360px;max-width:calc(100vw - 32px);
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);
  padding:16px 18px 14px;z-index:2;
  transition:top .28s cubic-bezier(.4,0,.2,1), left .28s cubic-bezier(.4,0,.2,1);
  animation:tourCardIn .22s ease;
}
@keyframes tourCardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.tour-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.tour-step-count{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--blue-light);border:1px solid var(--blue-line);padding:3px 8px;border-radius:100px;}
.tour-close{background:transparent;border:none;color:var(--text-3);font-size:14px;line-height:1;padding:4px;border-radius:6px;}
.tour-close:hover{background:var(--grey-chip);color:var(--text);}
.tour-progress{height:4px;background:var(--grey-chip);border-radius:100px;overflow:hidden;margin-bottom:12px;}
.tour-progress .fill{height:100%;background:var(--blue);transition:width .25s ease;}
.tour-title{margin:0 0 6px;font-size:15px;font-weight:800;letter-spacing:-.01em;}
.tour-text{margin:0;font-size:12.5px;line-height:1.55;color:var(--text-2);}
.tour-text b{color:var(--text);}
.tour-text ul{margin:8px 0 0;padding-left:18px;}
.tour-text li{margin-bottom:3px;}
.tour-flow{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px;font-size:12px;font-weight:700;color:var(--text);}
.tour-flow .fnode{background:var(--blue-light);border:1px solid var(--blue-line);color:var(--blue-dark);border-radius:8px;padding:6px 12px;width:100%;text-align:center;box-sizing:border-box;}
.tour-flow .farrow{color:var(--text-3);font-size:13px;}
.tour-actions{display:flex;align-items:center;gap:8px;margin-top:14px;}
.tour-kbd-hint{font-size:10.5px;color:var(--text-3);margin-top:10px;text-align:center;}
.tour-kbd-hint kbd{background:var(--grey-chip);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;}

/* banner */
.banner{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.banner.green{background:var(--green-light);color:var(--green);border:1px solid var(--green-line);}
.banner.amber{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-line);}
.banner.red{background:var(--red-light);color:var(--red);border:1px solid var(--red-line);}
.banner.blue{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-line);}

.empty{padding:40px 20px;text-align:center;color:var(--text-3);}
.empty .icon{font-size:28px;margin-bottom:8px;}

.audit-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.audit-row:last-child{border-bottom:none;}
.audit-time{color:var(--text-3);white-space:nowrap;flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:11px;padding-top:1px;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;}
.kv .k{color:var(--text-3);font-weight:600;}
.kv .v{font-weight:700;}

.pill-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:100px;padding:2px;background:var(--grey-chip);}

  const rooms = Object.values(ROOMS).filter(r=>r.building===id);
  if(!rooms.length) return 40;
  const occ = rooms.filter(r=>r.status==='Occupied'||r.status==='Reserved'||r.status==='Booked').length;
  return Math.round((occ/rooms.length)*100);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- NAV / ROUTING ---------------- */

/* Fields that describe WHERE you are (which screen/filter/focus) rather than WHAT you changed.
   The Back button only ever restores these — so import progress, force-cancel reasons, faculty
   request drafts, publish status, etc. are never rewound just because you navigated. */
const NAV_FIELDS = ['screen','mode','persona','focusBuildingId','focusRoomId','focusConflictId','mtView','mtDay'];

function go(screen, extra){
  if(state.screen && state.screen!==screen){
    const snap = {};
    NAV_FIELDS.forEach(f=>{ snap[f] = state[f]; });
    snap.mtFilters = {...state.mtFilters};
    state.history.push(snap);
    if(state.history.length>50) state.history.shift();
  }
  state.screen = screen;
  state.searchOpen=false; state.personaMenuOpen=false;
  if(extra) Object.assign(state, extra);
  window.scrollTo(0,0);
  render();
}

/* Global Back button — returns to the previous screen (with its filters/focus restored) while
   leaving every actual change you made — anywhere, on any screen — exactly as it was. */
function goBack(){
  if(!state.history.length) return;
  const prev = state.history.pop();
  Object.assign(state, prev);
  state.searchOpen=false; state.personaMenuOpen=false;
  state.modal = null; // never resurrect a modal that happened to be open on the previous screen
  window.scrollTo(0,0);
  render();
}
function setPersona(p){
  state.persona = p;
  state.personaMenuOpen=false;
  if(p==='hod'){ markWt('switchedHod'); go('hodDashboard'); return; }
  if(p==='faculty'){ markWt('switchedFaculty'); go('facultyWorkspace'); return; }
  if(p==='registrar'){ markWt('backToRegistrar'); go(state.mode==='planning'?'import':'registrarDashboard'); return; }
  render();
}

function renderTopnav(){
  if(state.persona==='registrar'){
    const items = [
      {id:'registrarDashboard', label:'Dashboard', mode:'operations'},
      {id:'import', label:'Planning', mode:'planning', tour:'nav-planning'},
      {id:'registrarDashboard', label:'Operations', mode:'operations', key:'operations'},
      {id:'masterTimetable', label:'Master Timetable', tour:'nav-master-timetable'},
      {id:'buildings', label:'Buildings'},
      {id:'conflictInbox', label:'Conflict Inbox', tour:'nav-conflict-inbox'},
      {id:'approvals', label:'Approvals'},
      {id:'reports', label:'Reports'},
    ];
    return items.map(it=>{
      const activeKey = it.key || it.id;
      const isActive = (it.key==='operations') ? (state.mode==='operations' && ['registrarDashboard','buildingOps','roomOps','emergencyOverride'].includes(state.screen))
        : (it.id==='import') ? (state.mode==='planning' && state.screen!=='masterTimetable')
        : state.screen===it.id;
      return `<button class="${isActive?'active':''}" ${it.tour?`data-tour="${it.tour}"`:''} onclick="handleTopnav('${it.id}','${it.mode||''}')">${it.label}</button>`;
    }).join('');
  }
  if(state.persona==='hod'){
    return `
      <button class="${state.screen==='hodDashboard'?'active':''}" onclick="go('hodDashboard')">Department Dashboard</button>
      <button class="${state.screen==='approvals'?'active':''}" onclick="go('approvals')">Approvals</button>
    `;
  }
  return `
    <button class="${state.screen==='facultyWorkspace'?'active':''}" onclick="go('facultyWorkspace')">My Classes</button>
    <button class="${state.screen==='facultyRequest'?'active':''}" onclick="go('facultyRequest')">Request Room</button>
  `;
}
function handleTopnav(id, mode){
  if(mode) state.mode = mode;
  if(id==='registrarDashboard' && state.mode==='operations'){ markWt('viewedDashboard'); }
  if(id==='masterTimetable'){ markWt('reviewedMaster'); if(state.midUpdateStatus==='done') markWt('viewedUpdatedMaster'); }
  go(id);
}

function renderSearch(){
  if(state.persona!=='registrar') return '';
  const q = state.searchQuery.trim().toLowerCase();
  let results = [];
  if(q){
    Object.values(ROOMS).forEach(r=>{ if(r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)) results.push({type:'Venue',label:r.name,go:()=>go('roomOps',{focusRoomId:r.id,focusBuildingId:r.building,mode:'operations'})}); });
    SESSIONS.forEach(s=>{ if(s.course.toLowerCase().includes(q)||s.faculty.toLowerCase().includes(q)) results.push({type:'Course',label:`${s.course} — ${s.faculty}`,go:()=>go(state.mode==='planning'?'timetable':'conflictInbox')}); });
    BUILDINGS.forEach(b=>{ if(b.name.toLowerCase().includes(q)) results.push({type:'Building',label:b.name,go:()=>go('buildingOps',{focusBuildingId:b.id,mode:'operations'})}); });
    results = results.slice(0,7);
  }
  return `
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search course, faculty, room, dept…" value="${esc(state.searchQuery)}"
      oninput="state.searchQuery=this.value; state.searchOpen=true; render();"
      onfocus="state.searchOpen=true; render();"
      onblur="setTimeout(()=>{state.searchOpen=false; render();},150)" />
    ${state.searchOpen && q ? `
    <div class="search-results">
      ${results.length? results.map((r,i)=>`
        <div class="search-row" onmousedown="searchGo(${i})">
          <span>${esc(r.label)}</span><span class="chip grey">${r.type}</span>
        </div>`).join('') : `<div class="search-empty">No matches across courses, faculty, rooms or buildings.</div>`}
    </div>` : ''}
  </div>`;
}
let _lastSearchResults = [];
function searchGo(i){ /* recomputed on render via closures; simplest: just rerun query */
  const q = state.searchQuery.trim().toLowerCase();
  let results = [];
  Object.values(ROOMS).forEach(r=>{ if(r.name.toLowerCase().includes(q)||r.id.toLowerCase().includes(q)) results.push(()=>go('roomOps',{focusRoomId:r.id,focusBuildingId:r.building,mode:'operations'})); });
  SESSIONS.forEach(s=>{ if(s.course.toLowerCase().includes(q)||s.faculty.toLowerCase().includes(q)) results.push(()=>go(state.mode==='planning'?'timetable':'conflictInbox')); });
  BUILDINGS.forEach(b=>{ if(b.name.toLowerCase().includes(q)) results.push(()=>go('buildingOps',{focusBuildingId:b.id,mode:'operations'})); });
  if(results[i]) results[i]();
  state.searchQuery=''; state.searchOpen=false;
}

const MID_UPDATE_STEPS = ['Performing Incremental Validation…','Checking Capacity Changes','Checking Cancelled Courses','Checking New Courses','Checking Venue Availability'];

function startMidSemesterUpdate(){
  if(state.midUpdateStatus==='running') return;
  state.midUpdateStatus='running';
  state.midUpdateStep=0;
  render();
  runMidUpdateStep();
}
function runMidUpdateStep(){
  setTimeout(()=>{
    state.midUpdateStep++;
    if(state.midUpdateStep>=MID_UPDATE_STEPS.length){
      state.midUpdateStatus='done';
      TIMETABLE_META.version++;
      // Only affected sessions are touched — simulate two affected allocations
      const s1 = SESSIONS.find(s=>s.id==='CS205');
      if(s1){ s1.status='Conflict'; s1.venue=null; }
      CONFLICTS.push({id:'mc'+Math.random().toString(36).slice(2,6),priority:'P1',title:'CS205',subtitle:'Venue Capacity Reduced · Hall A101 downrated below enrollment','type':'no_room',action:'Resolve',status:'open',sessionId:'CS205',origin:'Mid Semester Update'});
      const s2 = SESSIONS.find(s=>s.id==='MGT210');
      if(s2){ CONFLICTS.push({id:'mc'+Math.random().toString(36).slice(2,6),priority:'P2',title:'MGT210',subtitle:'New Section Added · Needs venue confirmation',type:'offline',action:'Review',status:'open',sessionId:'MGT210',roomId:s2.venue,origin:'Mid Semester Update'}); }
      logAudit(`Updated SIS schedule imported — incremental validation complete. Version ${TIMETABLE_META.version} created.`);
      toast('Incremental validation complete — only affected sessions flagged for review.', '🔄');
      markWt('incrementalValidated');
      render();
      return;
    }
    render();
    runMidUpdateStep();
  }, 480);
}
function renderMidUpdatePipeline(){

function mtFilteredSessions(){

    if(f.building && (!room || room.building!==f.building)) return false;
    if(f.room && s.venue!==f.room) return false;
    if(f.faculty && s.faculty!==f.faculty) return false;
    if(f.course && !s.course.toLowerCase().includes(f.course.toLowerCase())) return false;
    return true;

/* ---------------- SCREEN 4: MANUAL ALLOCATION ASSISTANT (modal) ---------------- */

function suggestedRoomsFor(conflict){
  const s = conflict.sessionId ? SESSIONS.find(s=>s.id===conflict.sessionId) : null;
  const need = s ? s.students : 0;
  if(conflict.type==='oversized'){
    return [{id:'SH2', reason:`Right-sized for ${need} students`}];
  }
  return Object.values(ROOMS).filter(r=>r.status==='Available' && r.capacity>=need && r.id!=='AUD').sort((a,b)=>a.capacity-b.capacity).slice(0,2).map(r=>({id:r.id}));
}

function renderModal(){
  if(!state.modal) return '';
  if(state.modal.type==='assist'){
    const c = CONFLICTS.find(x=>x.id===state.modal.conflictId);
    if(!c) { state.modal=null; return ''; }
    const s = c.sessionId ? SESSIONS.find(s=>s.id===c.sessionId) : null;
    const suggestions = suggestedRoomsFor(c);
    return `
    <div class="modal-backdrop" onmousedown="if(event.target===this){state.modal=null; render();}">
      <div class="modal" data-tour="allocation-modal">
        <div class="modal-head"><h3>Manual Allocation Assistant</h3><button class="close-x" onclick="state.modal=null; render();">✕</button></div>
        <div class="modal-body">
          <div class="conflict-title" style="margin-bottom:2px;">${esc(c.title)} <span class="pri ${c.priority}">${c.priority}</span></div>
          <div class="conflict-sub" style="margin-bottom:16px;">${esc(c.subtitle)}</div>
          <div style="font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);margin-bottom:10px;">Suggested Rooms — pre-filtered for eligibility</div>
          ${suggestions.map((sg,i)=>{
            const r = ROOMS[sg.id];
            return `<div class="room-suggest" ${i===0?`data-tour="assign-room-btn"`:''}>
              <div><div class="rname">${r.name}</div><div class="rmeta">Capacity ${r.capacity} · ${sg.reason || 'Available'} ${r.facilities.length?'· '+r.facilities.join(', '):''}</div></div>
              <button class="btn sm primary" onclick="assignRoom('${c.id}','${r.id}')">Assign</button>
            </div>`;
          }).join('')}
          ${!suggestions.length? `<div class="empty" style="padding:20px 0;">No eligible rooms found automatically.</div>`:''}
        </div>
        <div class="modal-foot">
          <span style="flex:1;font-size:12px;color:var(--text-3);">No fit? Escalate for registrar review.</span>
          <button class="btn danger" onclick="escalateConflict('${c.id}')">No Suitable Room · Escalate</button>
        </div>
      </div>
    </div>`;
  }
  if(state.modal.type==='onboard'){
    return renderOnboardModal();
  }
  if(state.modal.type==='editAlloc'){
    const m = state.modal;
    const session = SESSIONS.find(s=>s.id===m.sessionId);
    if(!session){ state.modal=null; return ''; }
    const currentRoom = ROOMS[session.venue];
    const options = editAllocOptions(session);

function submitReport(){
  const ta = document.getElementById('reportText');
  const val = ta ? ta.value.trim() : '';
  if(!val){ toast('Please describe the issue before submitting.', '⚠'); return; }
  logAudit(`Issue reported by ${personaLabel(state.persona)}: "${val}"`);
  toast('Thanks — your report has been logged for the team.', '🚩');
  state.modal=null;
  render();
}

function assignRoom(conflictId, roomId){
  const c = CONFLICTS.find(x=>x.id===conflictId);
  const room = ROOMS[roomId];
  if(c.sessionId){
    const s = SESSIONS.find(s=>s.id===c.sessionId);
    if(s){ s.venue = roomId; s.status='Assigned'; delete s.flag; }
  }
  c.status='resolved';
  logAudit(`${c.title} assigned to ${room.name} (Manual Allocation Assistant).`);
  toast(`${c.title} assigned to ${room.name}.`, '✓');
  markWt('resolvedConflict');
  state.modal = null;
  render();
}
function escalateConflict(conflictId){
  const c = CONFLICTS.find(x=>x.id===conflictId);
  c.status='escalated';
  logAudit(`${c.title} escalated to Registrar — no suitable room found.`);
  toast(`${c.title} escalated to Registrar.`, '⚑');
  state.modal = null;
  render();
}

/* ---------------- MASTER TIMETABLE EDIT ALLOCATION (Section 12) ---------------- */

function openEditAllocation(roomId){
  const session = SESSIONS.find(s=>s.venue===roomId);
  if(!session){ toast('No allocation to edit in this room.', 'ℹ'); return; }
  state.modal = {type:'editAlloc', sessionId:session.id, roomId, targetRoomId:'', stage:'pick'};
  render();
}

function editAllocOptions(session){
  return Object.values(ROOMS).filter(r=>r.status==='Available' && r.capacity>=session.students && r.id!==session.venue);
}

function runEditAllocation(){
  const m = state.modal;
  const session = SESSIONS.find(s=>s.id===m.sessionId);
  const targetRoom = ROOMS[m.targetRoomId];
  if(!session || !targetRoom) return;
  m.stage='validating'; m.pipe=0;
  render();
  const steps=3; // Validation -> Conflict Check -> Save
  const tick=()=>{
    setTimeout(()=>{
      m.pipe++;
      if(m.pipe>=steps){
        const success = targetRoom.status==='Available';
        if(success){
          const oldRoomId = session.venue;
          if(oldRoomId && ROOMS[oldRoomId]) ROOMS[oldRoomId].status='Available';
          session.venue = targetRoom.id;
          targetRoom.status='Occupied';
          logAudit(`${session.course} allocation edited — venue changed to ${targetRoom.name}. Course timings unchanged.`);
          toast('Master Timetable Updated — allocation saved.', '✓');
          m.stage='done';
        } else {
          CONFLICTS.push({id:'ec'+Math.random().toString(36).slice(2,6),priority:'P2',title:session.course,subtitle:`Venue Change Failed Validation · ${targetRoom.name} unavailable`,type:'no_room',action:'Resolve',status:'open',sessionId:session.id,origin:'Initial Planning'});
          logAudit(`${session.course} venue-change failed validation — routed to Conflict Inbox.`);
          toast('Validation failed — session routed to Conflict Inbox.', '⚠');
          m.stage='failed';
        }
        render();
        return;
      }
      render();
      tick();
    }, 500);
  };
  tick();
}

/* ---- Shared approval engine ----
   Fixes the approval bug: on final approval the selected room is immediately
   locked, the faculty schedule (SESSIONS) is updated, the request is removed
   from every pending queue (via status change), and the same venue is then
   read from ROOMS/REQUESTS/SESSIONS consistently by every dashboard. */
function lockRoomAndAssign(r, room, approverLabel){
  room.status='Reserved';
  room.allocatedTo=r.faculty;
  room.allocatedCourse=r.course;
  r.status='room_assigned';
  r.stage=4;
  r.roomId=room.id;
  r.venue=room.name;

  let session = SESSIONS.find(s=>s.id===r.id);
  if(session){ session.venue=room.id; session.status='Assigned'; }
  else { SESSIONS.push({id:r.id, course:r.course, faculty:r.faculty, students:r.strength, venue:room.id, status:'Assigned'}); }

  logAudit(`${r.course} approved by ${approverLabel}. ${room.name} locked and assigned to ${r.faculty}.`);
  toast(`Approved — ${room.name} locked for ${r.faculty}.`, '✓');
  markWt('approvedReq');
  render();
}

function roomStillAvailable(r){
  const room = ROOMS[r.roomId];
  return room && room.status==='Available';
}
function autoRejectUnavailable(r){
  r.status='rejected';
  r.rejectReason=`${ROOMS[r.roomId]?ROOMS[r.roomId].name:'The selected room'} is no longer available — it was booked by another confirmed request.`;
  logAudit(`${r.course} auto-rejected — selected room no longer available.`);
  toast('Room is no longer available — request auto-rejected. Faculty notified.', '⚠');
  render();
}

// Direct approval — request for the HoD's own department room
function approveRequest(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r || r.status!=='pending_dept') return;
  if(!roomStillAvailable(r)){ autoRejectUnavailable(r); return; }
  lockRoomAndAssign(r, ROOMS[r.roomId], 'HoD (Off-Hours/Weekend)');
}

// Owning-department HoD final approval for a cross-department request
function approveOwningHod(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r || r.status!=='pending_owning_hod') return;
  if(!roomStillAvailable(r)){ autoRejectUnavailable(r); return; }
  lockRoomAndAssign(r, ROOMS[r.roomId], `${r.owningDept} HoD`);
  toast(`Approved — ${r.venue} locked. ${r.faculty} notified.`, '✓');
  markWt('crossApproved');
}

// Registrar Level-2 approval for Common / Premium spaces
function approveGlobal(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r || r.status!=='pending_global') return;
  if(!roomStillAvailable(r)){ autoRejectUnavailable(r); return; }
  lockRoomAndAssign(r, ROOMS[r.roomId], 'Registrar (Level 2)');
}

// Home HoD recommendation step — routes to the Owning HoD (cross-dept) or Registrar (common/premium)
function recommendToNextStage(id){
  const r = REQUESTS.find(x=>x.id===id);
  if(!r) return;
  if(r.crossDept){
    r.status='pending_owning_hod'; r.stage=2;
    logAudit(`${r.course} recommended by Home HoD to ${r.owningDept} HoD for final approval.`);
    toast(`Recommended to ${r.owningDept} HoD for approval.`, '↪');
  } else {
    r.status='pending_global'; r.stage=2;
    const label = ROOMS[r.roomId] && ROOMS[r.roomId].ownership==='PREMIUM' ? 'Premium Space' : 'Common Facility';
    logAudit(`${r.course} recommended to Registrar for a ${label} (Level 2 approval).`);
    toast('Recommended to Registrar for Level 2 approval.', '↪');
  }
  render();
}

/* Backwards-compatible alias */

function submitFacultyRequest(){
  const d = state.facultyDraft;
  if(!d.roomId){ toast('Select a room before submitting.', '⚠'); return; }
  const room = ROOMS[d.roomId];
  const facilities = [];
  if(d.projector) facilities.push('Projector');
  if(d.ac) facilities.push('AC');
  const isOffHours = (d.time < '08:00' || d.time > '18:00');

  let status, stage, flowType, crossDept=false, homeDept=FACULTY_HOME_DEPT, owningDept=null;
  if(room.ownership==='DEPT_OWNED' && room.dept===FACULTY_HOME_DEPT){
    // Own Department — auto-validated, no HoD approval screen (unless weekend/off-hours)
    if(isOffHours){ status='pending_dept'; stage=1; flowType='offhours'; }
    else { status='validating'; stage=1; flowType='direct'; }
  } else if(room.ownership==='DEPT_OWNED'){
    // Cross Department — Home HoD recommendation, then Owning Dept HoD approval
    status='pending_recommendation'; stage=1; flowType='cross'; crossDept=true; owningDept=room.dept;
  } else {
    // Common Facility — straight to Registrar approval, no HoD step
    status='pending_global'; stage=1; flowType='common';
  }

  const req = {id:'r'+Math.random().toString(36).slice(2,7), course:'ME302 (Alternate Room)', faculty:'Dr Iyer', dept:FACULTY_HOME_DEPT, date:d.date, time:d.time, strength:d.strength, facilities, roomId:d.roomId, status, stage, flowType, crossDept, homeDept, owningDept, offHours:isOffHours};
  REQUESTS.push(req);
  logAudit(`Alternate room request submitted by Dr Iyer for ${room.name} on ${d.date} ${d.time}.`);
  markWt('submittedReq');

  if(flowType==='direct'){
    toast('Request submitted — running system validation…', '⏳');
    go('facultyWorkspace');
    runFacultyAutoValidation(req.id);

function runForceCancel(){

        ROOMS.AUD.status='Available';
        CONFLICTS.push({id:'c'+Math.random().toString(36).slice(2,6),priority:'P1',title:'MGT — Annual Seminar',subtitle:'Displaced by Force Cancel · needs reallocation',type:'no_room',action:'Resolve',status:'open'});

        toast('Force Cancel executed — audit log updated.', '⚡');
        markWt('forceCancel'); markWt('observed');
        render();
        return;
      }
      render();
      tick();
    }, 450);
  };
  tick();
}

function tourGoTo(i){
  if(i>=TOUR_STEPS.length){ tourFinish(); return; }
  if(i<0) return;
  tourEnterStep(i);
}

function tourEnterStep(i){
  clearTourPoll();
  tourState.index = i;
  const step = TOUR_STEPS[i];
  if(step.onEnter) step.onEnter();
  render();
  setTimeout(()=>{
    if(!tourState.active || tourState.index!==i) return;
    const el = step.selector ? document.querySelector(step.selector) : null;
    if(el) el.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
  }, 60);
  if(step.autoAdvanceWait){
    tourState.pollTimer = setInterval(()=>{
      if(!tourState.active || tourState.index!==i){ clearInterval(tourState.pollTimer); return; }
      if(step.autoAdvanceWait()){
        clearInterval(tourState.pollTimer); tourState.pollTimer=null;
        setTimeout(()=>{ if(tourState.active && tourState.index===i) tourGoTo(i+1); }, 700);
      }
    }, 300);
  }
}

function startTour(){
  clearTourPoll();
  tourState = {active:true, index:0, pollTimer:null};
  tourEnterStep(0);
}

function tourNext(){
  const i = tourState.index;
  const step = TOUR_STEPS[i];
  if(step.onNext) step.onNext();
  if(step.waitAfterNext){
    clearTourPoll();
    tourState.pollTimer = setInterval(()=>{
      if(!tourState.active || tourState.index!==i){ clearInterval(tourState.pollTimer); return; }
      if(step.waitAfterNext()){
        clearInterval(tourState.pollTimer); tourState.pollTimer=null;
        setTimeout(()=>{ if(tourState.active && tourState.index===i) tourGoTo(i+1); }, 500);
      }
    }, 300);
    render();
    return;
  }
  tourGoTo(i+1);
}
function tourPrev(){
  if(tourState.index>0) tourEnterStep(tourState.index-1);
}
function tourSkip(){
  clearTourPoll();
  tourState.active=false;
  state.history=[];
  toast('Tour skipped — restart anytime from the header.', '🧭');
  render();
}
function tourFinish(){
  clearTourPoll();
  tourState.active=false;
  state.history=[];
  toast("Tour complete — that's the full CampusOps lifecycle.", '🎉');
  render();
}
function tourKeyHandler(e){
  if(!tourState.active) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); tourNext(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); tourPrev(); }
  else if(e.key==='Escape'){ e.preventDefault(); tourSkip(); }
}

function renderTourOverlay(){
  let root = document.getElementById('tourRoot');
  if(!tourState.active){
    if(root) root.remove();
    return;
  }
  if(!root){
    root = document.createElement('div');
    root.id = 'tourRoot';
    document.body.appendChild(root);
  }
  const step = TOUR_STEPS[tourState.index];
  const total = TOUR_STEPS.length;
  const idx = tourState.index;
  const targetEl = step.selector ? document.querySelector(step.selector) : null;
  const rect = targetEl ? targetEl.getBoundingClientRect() : null;

  let spotlightHtml = '';
  let cardStyle = `top:50%;left:50%;transform:translate(-50%,-50%);`;

  if(rect && rect.width>0 && rect.height>0){
    const pad = 8;
    const top = Math.max(rect.top-pad, 4);
    const left = Math.max(rect.left-pad, 4);
    const w = Math.min(rect.width+pad*2, window.innerWidth-8);
    const h = rect.height+pad*2;
    spotlightHtml = `<div class="tour-spotlight" style="top:${top}px;left:${left}px;width:${w}px;height:${h}px;"></div>`;

    const cardW = 360;
    let cTop = top + h + 14;
    let cLeft = Math.min(Math.max(left, 16), Math.max(window.innerWidth-cardW-16, 16));
    if(cTop + 220 > window.innerHeight){ cTop = Math.max(top-14-260, 12); }
    cardStyle = `top:${cTop}px;left:${cLeft}px;transform:none;`;
  }

  root.innerHTML = `
    <div class="tour-overlay" onclick="event.stopPropagation();"></div>
    ${spotlightHtml}
    <div class="tour-card" style="${cardStyle}">
      <div class="tour-card-head">
        <span class="tour-step-count">Step ${idx+1} of ${total}</span>
        <button class="tour-close" title="Skip Tour" onclick="tourSkip()">✕</button>
      </div>
      <div class="tour-progress"><div class="fill" style="width:${Math.round(((idx+1)/total)*100)}%"></div></div>
      <h3 class="tour-title">${step.title}</h3>
      <div class="tour-text">${step.body}</div>
      <div class="tour-actions">
        <button class="btn ghost sm" onclick="tourSkip()">Skip Tour</button>
        <div style="flex:1"></div>
        ${idx>0 ? `<button class="btn sm" onclick="tourPrev()">← Previous</button>` : ''}
        ${idx<total-1 ? `<button class="btn primary sm" onclick="tourNext()">Next →</button>` : `<button class="btn primary sm" onclick="tourFinish()">Finish ✓</button>`}
      </div>
      <div class="tour-kbd-hint"><kbd>←</kbd> Previous · <kbd>→</kbd> Next · <kbd>Esc</kbd> Skip</div>
    </div>
  `;
}

/* ---------------- TOASTS ---------------- */

function renderToasts(){
  return `<div class="toast-stack">${state.toasts.map(t=>`<div class="toast"><span class="ic">${t.icon}</span><span>${esc(t.msg)}</span></div>`).join('')}</div>`;
}

/* ---------------- ROOT RENDER ---------------- */

const SCREENS = {
  import: screenImport,
  timetable: screenTimetable,
  masterTimetable: screenMasterTimetable,
  conflictInbox: screenConflictInbox,
  registrarDashboard: screenRegistrarDashboard,
  buildings: screenBuildings,
  buildingOps: screenBuildingOps,
  roomOps: screenRoomOps,
  hodDashboard: screenHodDashboard,
  facultyWorkspace: screenFacultyWorkspace,
  facultyRequest: screenFacultyRequest,
  approvals: screenApprovals,
  reports: screenReports,
  emergencyOverride: screenEmergencyOverride,
  auditView: screenAuditView,
};

function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;

  const screenFn = SCREENS[state.screen] || screenImport;
  document.getElementById('app').innerHTML = `
    ${renderTopbar()}
    <div class="body-wrap">
      <div class="main">${screenFn()}</div>
    </div>
    ${tourState.active ? '' : renderWalkthrough()}
    ${renderToasts()}
    ${renderModal()}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  renderTourOverlay();
}

/* initial boot */
state.modal = {type:'onboard'};
render();
document.addEventListener('keydown', tourKeyHandler);
</script>
</body>
</html>
