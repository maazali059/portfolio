function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m = n<=1?1:n<=2?2:n<=5?5:10; return m*p; }

/* Horizontal stacked bar — used for candidate mix + landed cost buildup */
function hStackedBar(segments, width, height){
  const total = segments.reduce((s,x)=>s+Math.max(x.value,0),0) || 1;
  let x=0; let out='';
  segments.forEach(seg=>{
    const w = Math.max(seg.value,0)/total*width;
    if(w>0.3) out += svgEl('rect',{x:x.toFixed(1), y:0, width:w.toFixed(1), height, fill:seg.color, opacity:0.95});
    x+=w;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">${out}</svg>`;
}

/* Vertical grouped/stacked bar chart with axis */
function stackedBarChart(opts){
  const {categories, series, width=640, height=260, unit='', pad={t:14,r:14,b:34,l:46}} = opts;
  const plotW = width-pad.l-pad.r, plotH = height-pad.t-pad.b;
  const totals = categories.map((_,i)=> series.reduce((s,ser)=> s + Math.max(ser.data[i]||0,0), 0));
  const negTotals = categories.map((_,i)=> series.reduce((s,ser)=> s + Math.min(ser.data[i]||0,0), 0));
  const maxV = niceMax(Math.max(...totals,0.001));
  const minV = Math.min(0, ...negTotals);
  const range = maxV-minV;
  const y = v => pad.t + plotH - ((v-minV)/range)*plotH;
  const zeroY = y(0);
  const bw = plotW/categories.length;
  let bars=''; let axis='';
  // gridlines
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v = minV + range*i/steps;
    const yy = y(v);
    axis += svgEl('line',{x1:pad.l,x2:width-pad.r,y1:yy.toFixed(1),y2:yy.toFixed(1),class:'gridLine'});
    axis += svgEl('text',{x:pad.l-6,y:(yy+3).toFixed(1),class:'axisLabel','text-anchor':'end'}, fmt(v,v>100?0:1));
  }
  categories.forEach((cat,i)=>{
    let posY=zeroY, negY=zeroY;
    const cx = pad.l + i*bw + bw*0.15;
    const cw = bw*0.7;
    series.forEach(ser=>{
      const v = ser.data[i]||0;
      if(v>=0){ const yy=y(v); bars += svgEl('rect',{x:cx.toFixed(1),y:yy.toFixed(1),width:cw.toFixed(1),height:(posY-yy).toFixed(1),fill:ser.color,opacity:0.95}); posY=yy; }
      else { const yy=y(v); bars += svgEl('rect',{x:cx.toFixed(1),y:negY.toFixed(1),width:cw.toFixed(1),height:(yy-negY).toFixed(1),fill:ser.color,opacity:0.95}); negY=yy; }
    });
    axis += svgEl('text',{x:(cx+cw/2).toFixed(1),y:height-pad.b+16,class:'axisLabel','text-anchor':'middle'}, cat);
  });
  axis += svgEl('line',{x1:pad.l,x2:width-pad.r,y1:zeroY.toFixed(1),y2:zeroY.toFixed(1),stroke:'var(--line)','stroke-width':1});
  return `<svg viewBox="0 0 ${width} ${height}">${axis}${bars}</svg>`;
}

/* Stacked area chart (hourly dispatch) with a load line overlay and optional SOC line on secondary axis */
function stackedAreaChart(opts){
  const {labels, series, loadLine, socLine, width=900, height=280, pad={t:14,r:44,b:26,l:44}} = opts;
  const n = labels.length;
  const plotW = width-pad.l-pad.r, plotH = height-pad.t-pad.b;
  const posTotals = labels.map((_,i)=> series.reduce((s,ser)=> s+Math.max(ser.data[i]||0,0),0));
  const negTotals = labels.map((_,i)=> series.reduce((s,ser)=> s+Math.min(ser.data[i]||0,0),0));
  const maxV = niceMax(Math.max(...posTotals, ...(loadLine?loadLine:[0]), 0.001));
  const minV = Math.min(0, ...negTotals);
  const range = maxV-minV;
  const y = v => pad.t + plotH - ((v-minV)/range)*plotH;
  const x = i => pad.l + (n<=1?0:(i/(n-1))*plotW);
  const zeroY = y(0);
  let axis='', areas='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v = minV+range*i/steps; const yy=y(v);
    axis += svgEl('line',{x1:pad.l,x2:width-pad.r,y1:yy.toFixed(1),y2:yy.toFixed(1),class:'gridLine'});
    axis += svgEl('text',{x:pad.l-6,y:(yy+3).toFixed(1),class:'axisLabel','text-anchor':'end'}, fmt(v,0));
  }
  const xTickEvery = Math.max(1, Math.round(n/12));
  labels.forEach((lb,i)=>{ if(i%xTickEvery===0) axis += svgEl('text',{x:x(i).toFixed(1),y:height-pad.b+15,class:'axisLabel','text-anchor':'middle'}, lb); });
  // stacked positive
  let posAcc = new Array(n).fill(0), negAcc = new Array(n).fill(0);
  series.forEach(ser=>{
    let topPath='M', botPath='';
    const pts=[];
    for(let i=0;i<n;i++){
      const v = ser.data[i]||0;
      let y0,y1v;
      if(v>=0){ y0=posAcc[i]; posAcc[i]+=v; y1v=posAcc[i]; }
      else { y0=negAcc[i]; negAcc[i]+=v; y1v=negAcc[i]; }
      pts.push([x(i), y(y1v), y(y0)]);
    }
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
    for(let i=1;i<n;i++) d += `L ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} `;
    for(let i=n-1;i>=0;i--) d += `L ${pts[i][0].toFixed(1)} ${pts[i][2].toFixed(1)} `;
    d += 'Z';
    areas += svgEl('path',{d, fill:ser.color, opacity:0.88});
  });
  axis += svgEl('line',{x1:pad.l,x2:width-pad.r,y1:zeroY.toFixed(1),y2:zeroY.toFixed(1),stroke:'var(--line)','stroke-width':1});
  let loadPath='';
  if(loadLine){
    let d = `M ${x(0).toFixed(1)} ${y(loadLine[0]).toFixed(1)} `;
    for(let i=1;i<n;i++) d += `L ${x(i).toFixed(1)} ${y(loadLine[i]).toFixed(1)} `;
    loadPath = svgEl('path',{d, fill:'none', stroke:'var(--c-load)','stroke-width':1.6,'stroke-dasharray':'2 3'});
  }
  let socPath='';
  if(socLine){
    const maxSOC=100;
    const ys = v => pad.t + plotH - (v/maxSOC)*plotH;
    let d = `M ${x(0).toFixed(1)} ${ys(socLine[0]).toFixed(1)} `;
    for(let i=1;i<n;i++) d += `L ${x(i).toFixed(1)} ${ys(socLine[i]).toFixed(1)} `;
    socPath = svgEl('path',{d, fill:'none', stroke:'var(--accent)','stroke-width':1.6});
    axis += svgEl('text',{x:width-pad.r+6,y:pad.t+4,class:'axisLabel'}, 'SOC%');
  }
  return `<svg viewBox="0 0 ${width} ${height}">${axis}${areas}${loadPath}${socPath}</svg>`;
}

/* Simple line chart, e.g. DSCR by year */
function lineChart(opts){
  const {labels, lines, width=900, height=240, pad={t:16,r:20,b:26,l:40}, refLine} = opts;
  const n = labels.length;
  const plotW=width-pad.l-pad.r, plotH=height-pad.t-pad.b;
  const allV = lines.flatMap(l=>l.data.filter(v=>isFinite(v)));
  let maxV = niceMax(Math.max(...allV, refLine||0, 0.001));
  let minV = Math.min(0, ...allV);
  const range = (maxV-minV)||1;
  const y = v => pad.t+plotH-((v-minV)/range)*plotH;
  const x = i => pad.l+(n<=1?0:(i/(n-1))*plotW);
  let axis='', paths='';
  for(let i=0;i<=4;i++){ const v=minV+range*i/4; const yy=y(v); axis+=svgEl('line',{x1:pad.l,x2:width-pad.r,y1:yy.toFixed(1),y2:yy.toFixed(1),class:'gridLine'}); axis+=svgEl('text',{x:pad.l-6,y:(yy+3).toFixed(1),class:'axisLabel','text-anchor':'end'},fmt(v,1)); }
  const xTickEvery = Math.max(1, Math.round(n/10));
  labels.forEach((lb,i)=>{ if(i%xTickEvery===0) axis+=svgEl('text',{x:x(i).toFixed(1),y:height-pad.b+15,class:'axisLabel','text-anchor':'middle'},lb); });
  if(refLine!=null){ const yy=y(refLine); axis+=svgEl('line',{x1:pad.l,x2:width-pad.r,y1:yy.toFixed(1),y2:yy.toFixed(1),stroke:'var(--warn)','stroke-width':1,'stroke-dasharray':'4 3'}); }
  lines.forEach(l=>{
    let d=''; let started=false;
    l.data.forEach((v,i)=>{ if(!isFinite(v)) { started=false; return;} d += (started?'L':'M')+` ${x(i).toFixed(1)} ${y(v).toFixed(1)} `; started=true; });
    paths += svgEl('path',{d, fill:'none', stroke:l.color, 'stroke-width':1.8});
  });
  return `<svg viewBox="0 0 ${width} ${height}">${axis}${paths}</svg>`;
}

/* Donut for renewable share etc */
function donut(pct, color, size=86, stroke=9){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const off = c*(1-clampV(pct,0,100)/100);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" font-family="var(--font-mono)" font-size="16" fill="var(--text)">${fmt(pct,0)}%</text>
  </svg>`;
}

/* Single-line energy-flow schematic: sources -> BESS -> Load, with a Grid backup edge.
   Widths encode annual GWh. */
function flowSchematic(ev, width=920, height=300){
  const a = ev.annual;
  const nodes = {
    solar:{x:70,y:40,label:'SOLAR',v:a.solar,color:'var(--c-solar)'},
    wind:{x:70,y:100,label:'WIND',v:a.wind,color:'var(--c-wind)'},
    oa:{x:70,y:160,label:'GREEN OA',v:a.oa,color:'var(--c-oa)'},
    gc:{x:70,y:220,label:'GROUP CAPTIVE',v:a.gc,color:'var(--c-gc)'},
    grid:{x:70,y:280,label:'GRID',v:a.grid,color:'var(--c-grid)'},
    bess:{x:width*0.52,y:150,label:'BESS',v:Math.max(a.bessCharge,a.bessDischarge),color:'var(--c-bess)'},
    load:{x:width-90,y:150,label:'CHARGING LOAD',v:a.demand,color:'var(--c-load)'},
  };
  const maxFlow = Math.max(a.solar,a.wind,a.oa,a.gc,a.grid,a.demand,1);
  const wScale = v => 1.2+(Math.max(v,0)/maxFlow)*9;
  let edges='', labels='';
  const path = (x1,y1,x2,y2)=>`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`;
  // direct-to-load sources (solar/wind assumed able to feed load directly per priority; oa/gc/grid feed load directly too)
  ['solar','wind','oa','gc','grid'].forEach(k=>{
    const n = nodes[k];
    if(n.v>0.01){
      edges += svgEl('path',{d:path(n.x+46,n.y,nodes.load.x-16,nodes.load.y), class:'flowEdge dash', stroke:n.color, 'stroke-width':wScale(n.v).toFixed(1)});
    }
  });
  // BESS charge/discharge
  if(a.bessCharge>0.01){
    edges += svgEl('path',{d:path(nodes.solar.x+46, nodes.solar.y+8, nodes.bess.x-14, nodes.bess.y-18), class:'flowEdge dash', stroke:'var(--c-bess)', 'stroke-width':wScale(a.bessCharge*0.6).toFixed(1)});
  }
  if(a.bessDischarge>0.01){
    edges += svgEl('path',{d:path(nodes.bess.x+16, nodes.bess.y, nodes.load.x-16, nodes.load.y+20), class:'flowEdge dash', stroke:'var(--c-bess)', 'stroke-width':wScale(a.bessDischarge).toFixed(1)});
  }
  Object.entries(nodes).forEach(([k,n])=>{
    if(k==='bess'){
      labels += `<g class="flowNode"><rect x="${n.x-30}" y="${n.y-20}" width="60" height="40" rx="4" fill="var(--panel-2)" stroke="${n.color}"/>
      <text x="${n.x}" y="${n.y-4}" text-anchor="middle" class="lbl">${n.label}</text>
      <text x="${n.x}" y="${n.y+13}" text-anchor="middle">${fmt(n.v/1000,1)} GWh</text></g>`;
    } else if(k==='load'){
      labels += `<g class="flowNode"><rect x="${n.x-10}" y="${n.y-46}" width="70" height="92" rx="4" fill="var(--panel-2)" stroke="${n.color}"/>
      <text x="${n.x+25}" y="${n.y-30}" text-anchor="middle" class="lbl">${n.label}</text>
      <text x="${n.x+25}" y="${n.y-6}" text-anchor="middle">${fmt(n.v/1000,1)} GWh</text>
      <text x="${n.x+25}" y="${n.y+10}" text-anchor="middle" class="lbl" fill="${a.unserved>0.01?'var(--bad)':'var(--text-faint)'}">unserved</text>
      <text x="${n.x+25}" y="${n.y+24}" text-anchor="middle" fill="${a.unserved>0.01?'var(--bad)':'var(--text-faint)'}">${fmt(a.unserved/1000,2)} GWh</text></g>`;
    } else {
      labels += `<g class="flowNode"><circle cx="${n.x}" cy="${n.y}" r="26" fill="var(--panel-2)" stroke="${n.color}"/>
      <text x="${n.x}" y="${n.y-3}" text-anchor="middle" class="lbl">${n.label}</text>
      <text x="${n.x}" y="${n.y+12}" text-anchor="middle">${fmt(n.v/1000,1)}</text></g>`;
    }
  });
  return `<svg viewBox="0 0 ${width} ${height}">${edges}${labels}</svg>`;
}

/* ---------- dot/bracket path get/set, e.g. "inp.procState.grid.slots[1].rate" ---------- */
function pathParts(p){ return p.replace(/\[(\d+)\]/g,'.$1').split('.'); }
function getPath(obj, p){ return pathParts(p).reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, p, val){
  const parts = pathParts(p); const last = parts.pop();
  const target = parts.reduce((o,k)=> (o[k]==null? (o[k]={}) : o[k]), obj);
  target[last]=val;
}
function coerce(raw, type){
  if(type==='number') return raw===''? null : parseFloat(raw);
  if(type==='checkbox') return !!raw;
  return raw;
}

/* ---------- recompute pipeline (cheap enough to run on every render) ---------- */
function computeAll(){

}

/* ---------- generic delegated event wiring (bind once) ---------- */
function initDelegation(){
  const root = document.getElementById('app'); // covers header, phase nav, summary bar AND mainContent
  const handle = (e, committing) => {
    const el = e.target.closest('[data-bind]');
    if(!el) return;
    const path = el.getAttribute('data-bind');
    const type = el.getAttribute('data-type') || (el.type==='checkbox'?'checkbox':el.tagName==='SELECT'?'select':el.type==='number'||el.type==='range'?'number':'text');
    let val = type==='checkbox' ? el.checked : el.value;
    val = coerce(val, type);
    setPath(STATE, path, val);
    const liveLabel = el.closest('label.field')?.querySelector('.fval');
    if(liveLabel && el.type==='range') liveLabel.textContent = el.getAttribute('data-suffix') ? val+el.getAttribute('data-suffix') : val;
    if(committing) rerenderCurrent();
  };
  root.addEventListener('input', e=>{
    const el = e.target.closest('[data-bind]');
    if(el && el.type==='range') handle(e, false);
  });
  root.addEventListener('change', e=> handle(e, true));
  root.addEventListener('click', e=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const attr = el.getAttribute('data-action');
    const idx = attr.indexOf(':');
    const fn = idx<0 ? attr : attr.slice(0,idx);
    const arg = idx<0 ? undefined : attr.slice(idx+1);
    if(typeof window[fn]==='function') window[fn](arg, el);
  });
}

  Object.assign(STATE.inp, {g_energy:b.g_energy, oa_css:b.oa_css, oa_wheel:b.oa_wheel, oa_addl:b.oa_addl, oa_bank:b.oa_bank, gc_charges:b.gc_charges, s_cuf:b.s_cuf, w_cuf:b.w_cuf});
  render();
}

  const inp = STATE.inp;
  const dailyKWh = inp.vehicles.reduce((s,r)=>s+r.vpd*r.spd*r.kwh,0);

    <div class="card">
      <div class="cardHead"><h3>Operating pattern</h3></div>

          <option value="evening" ${inp.shape==='evening'?'selected':''}>Evening peak</option>

      <label class="field"><div class="flabel"><span>Annual demand growth</span><span class="fval">${fmt(inp.growth,1)}%</span></div>
        <input type="range" min="0" max="20" step="0.5" value="${inp.growth}" data-bind="inp.growth"/></label>
      <details class="advanced">
        <summary>Utilisation ramp assumptions</summary>
        <div class="row" style="margin-top:10px;">
          <label class="field"><div class="flabel"><span>Year-1 utilisation</span><span class="fval">${inp.util_y1}%</span></div>
            <input type="range" min="5" max="100" value="${inp.util_y1}" data-bind="inp.util_y1"/></label>
          <label class="field"><div class="flabel"><span>Terminal utilisation</span><span class="fval">${inp.util_terminal}%</span></div>
            <input type="range" min="20" max="100" value="${inp.util_terminal}" data-bind="inp.util_terminal"/></label>
        </div>
        <div class="row">
          <label class="field"><div class="flabel"><span>Ramp years</span><span class="fval">${inp.util_rampyears}</span></div>

      <label class="field"><div class="flabel"><span>Reliability preference</span></div>
        <select data-bind="inp.reliab" data-type="select">

        <select data-bind="inp.priority" data-type="select">

          <option value="solar-wind-bess-gc-oa-grid" ${inp.priority==='solar-wind-bess-gc-oa-grid'?'selected':''}>Solar → Wind → BESS → GC → OA → Grid</option>
        </select></label>
    </div>
  </div>
  <div class="stepFooter">

  </div>
  `;
}
function addVehicle(){ STATE.inp.vehicles.push({name:'New segment', vpd:10, spd:1, kwh:20}); render(); }
function removeVehicle(i){ STATE.inp.vehicles.splice(+i,1); render(); }

/* ---------------- Decision step: run optimizer, show top candidates ---------------- */
function viewDecision(){
  const inp = STATE.inp;
  if(!STATE.decisionResults){
    return `
    <h2 class="sectionTitle">03 · Decision</h2>
    <p class="sectionDesc">ENERGYNEX runs a coarse search across combinations of Solar, Wind, Green OA, Group Captive and BESS, then refines the top candidates with exact 15-year financing — this is a structured search over a representative grid of sizes, not an exhaustive search of every continuous combination.</p>
    <div class="card emptyState">
      <div class="big">⚙</div>
      <p>Ready to evaluate architectures for this site against a ${inp.retarget}% renewable target.</p>
      <button class="btn primary" data-action="runOptimizer">Find best architecture</button>
      <p style="margin-top:14px;"><a href="#" data-action="skipToManual">Skip — build an architecture manually →</a></p>
    </div>`;
  }
  const results = STATE.decisionResults;
  const maxCap = Math.max(...results.map(r=> r.ev.candidate.solarMW+r.ev.candidate.windMW+r.ev.candidate.oaMW+r.ev.candidate.gcMW+r.ev.candidate.bessMW), 1);
  return `
  <h2 class="sectionTitle">03 · Decision</h2>
  <p class="sectionDesc">Top-ranked architectures for this site (coarse search → exact financial refinement), evaluated on 15-year equity NPV at your ${fmt(inp.f_hurdle,1)}% hurdle rate, subject to the ${inp.retarget}% renewable target and ${inp.reliab==='high'?'high-reliability grid cap':'standard reliability'} constraint.</p>
  <div class="colsAuto">
    ${results.map((r,i)=>candidateCard(r,i)).join('')}
  </div>
  <div class="stepFooter">
    <button class="btn" data-action="gotoStep:energy">← Back to Energy</button>
    <span><a href="#" data-action="skipToManual">Build manually instead →</a></span>
  </div>
  `;
}
function candidateCard(r,i){
  const c = r.ev.candidate; const a = r.ev.annual;
  const mix = [
    {k:'solar',v:a.solar},{k:'wind',v:a.wind},{k:'oa',v:a.oa},{k:'gc',v:a.gc},{k:'bess',v:a.bessDischarge},{k:'grid',v:a.grid}
  ].filter(x=>x.v>0.01);
  const total = mix.reduce((s,x)=>s+x.v,0)||1;
  return `
  <div class="candCard ${i===0?'best':''}">
    <span class="rank">${i===0?'RECOMMENDED':'#'+(i+1)}</span>
    <h4>${r.name}</h4>
    <div class="candMix">${mix.map(x=>`<span style="width:${(x.v/total*100).toFixed(1)}%;background:${SRC_COLORS[x.k]}"></span>`).join('')}</div>
    <div class="candLegend">${mix.map(x=>`<span><span class="dot" style="background:${SRC_COLORS[x.k]}"></span> ${SRC_LABELS[x.k]} ${fmt(x.v/total*100,0)}%</span>`).join('')}</div>
    <div class="candKpis">
      <div><div class="v">${fmt(r.ev.renShare,0)}%</div><div class="l">Renewable share</div></div>
      <div><div class="v">₹${fmt(r.ev.landedCostPerKWh,2)}</div><div class="l">Landed ₹/kWh</div></div>
      <div><div class="v">${irrLabel(r.finExact.projectIRR)}</div><div class="l">Project IRR</div></div>
      <div><div class="v">${irrLabel(r.finExact.equityIRR)}</div><div class="l">Equity IRR</div></div>
      <div><div class="v">${isNaN(r.finExact.payback)?'—':fmt(r.finExact.payback,1)+'y'}</div><div class="l">Payback</div></div>
      <div><div class="v">${isNaN(r.finExact.avgDSCR)?'—':fmt(r.finExact.avgDSCR,2)+'x'}</div><div class="l">Avg DSCR</div></div>
    </div>
    <div style="font-size:10.5px;color:var(--text-faint);">CAPEX ₹${fmt(r.finExact.totalCapexCr,1)} Cr · ${c.solarMW>0.01?`Solar ${fmt(c.solarMW,1)}MW `:''}${c.windMW>0.01?`Wind ${fmt(c.windMW,1)}MW `:''}${c.oaMW>0.01?`OA ${fmt(c.oaMW,1)}MW `:''}${c.gcMW>0.01?`GC ${fmt(c.gcMW,1)}MW `:''}${c.bessMWh>0.01?`BESS ${fmt(c.bessMWh,1)}MWh`:''}</div>
    <button class="btn primary sm" data-action="selectCandidate:${i}">Select &amp; open workspace →</button>
  </div>`;
}
function runOptimizer(){
  const inp = STATE.inp;
  const units = getUnitShapes(inp);
  const baseDemand = getBaseDemand8760(inp);
  const gridCapMW = gridCapacityMW(inp, inp.g_upgrade_avail);
  STATE.decisionResults = optimizeArchitecture(inp, units, baseDemand, gridCapMW, 5);
  render();
}
function selectCandidate(i){ enterPhase2(STATE.decisionResults[+i].ev.candidate); }
function skipToManual(){ enterPhase2(defaultCandidate()); }
/* ============================================================
   PHASE 2 — ARCHITECTURE
   ============================================================ */

  const inp = STATE.inp, c = STATE.candidate, {ev} = STATE._cache;
  return `

  <div class="card" style="margin-bottom:18px;">
    <div class="cardHead"><h3>Annual energy flow</h3><span class="hint">GWh/year — annual contribution by source, not simultaneous hourly flow (see Dispatch for hour-by-hour)</span></div>
    <div class="chartWrap">${flowSchematic(ev)}</div>
    <div class="colsAuto" style="margin-top:14px;">
      <div class="kpi ${ev.renShare>=inp.retarget?'good':'warn'}"><div class="kv">${fmt(ev.renShare,0)}<span class="unit">%</span></div><div class="kl">Renewable share</div><div class="ksub">target ${inp.retarget}%</div></div>
      <div class="kpi"><div class="kv">${fmt(ev.annual.demand>0?(ev.annual.grid/ev.annual.demand*100):0,0)}<span class="unit">%</span></div><div class="kl">Grid dependency</div></div>
      <div class="kpi ${ev.annual.curtail>1?'warn':''}"><div class="kv">${fmt(ev.annual.curtail,1)}<span class="unit">MWh</span></div><div class="kl">Curtailed RE</div></div>
      <div class="kpi ${ev.unservedMWh>0.1?'bad':'good'}"><div class="kv">${fmt(ev.unservedMWh,2)}<span class="unit">MWh</span></div><div class="kl">Unserved energy</div></div>
      <div class="kpi"><div class="kv">₹${fmt(ev.landedCostPerKWh,2)}</div><div class="kl">Landed cost /kWh</div></div>
      <div class="kpi"><div class="kv">${fmt(ev.peakGridMW,2)}<span class="unit">MW</span></div><div class="kl">Peak sanctioned draw</div><div class="ksub">sanctioned ${fmt(ev.sanctionedMW,2)} MW</div></div>
      <div class="kpi ${ev.peakGridNeedMW>ev.peakGridMW+0.01?'warn':''}"><div class="kv">${fmt(ev.peakGridNeedMW,2)}<span class="unit">MW</span></div><div class="kl">Peak unconstrained requirement</div><div class="ksub">${ev.peakGridNeedMW>ev.peakGridMW+0.01?'capped by sanctioned load':'within sanctioned capacity'}</div></div>
    </div>
  </div>

  <div class="cols2">
    <div class="viewGrid">
      <div class="card">
        <div class="cardHead"><h3>Generation &amp; storage capacity</h3></div>
        ${capField('Solar PV','candidate.solarMW',c.solarMW,0,20,0.1,'MW')}
        ${capField('Wind','candidate.windMW',c.windMW,0,20,0.1,'MW')}
        ${capField('Green Open Access','candidate.oaMW',c.oaMW,0,20,0.1,'MW')}
        ${capField('Group Captive','candidate.gcMW',c.gcMW,0,20,0.1,'MW')}
        <div class="row">
          ${capField('BESS power','candidate.bessMW',c.bessMW,0,10,0.1,'MW')}
          ${capField('BESS energy','candidate.bessMWh',c.bessMWh,0,30,0.1,'MWh')}
        </div>
        <div class="pill ${bessCrateOK(c)?'good':'bad'}">C-rate ${c.bessMWh>0?fmt(c.bessMW/c.bessMWh,2):'—'} (allowed ${fmt(inp.b_cratemin,2)}–${fmt(inp.b_cratemax,2)})</div>
        <details class="advanced">
          <summary>Group Captive terms</summary>
          <div class="row" style="margin-top:10px;">
            <label class="field"><div class="flabel"><span>My equity stake</span><span class="fval">${inp.gc_myequity}%</span></div><input type="range" min="0" max="100" value="${inp.gc_myequity}" data-bind="inp.gc_myequity"/></label>
            <label class="field"><div class="flabel"><span>Solar share of GC plant</span><span class="fval">${inp.gc_solarshare}%</span></div><input type="range" min="0" max="100" value="${inp.gc_solarshare}" data-bind="inp.gc_solarshare"/></label>
          </div>
          <div class="pill ${ev.gcElig.status==='ELIGIBLE'?'good':ev.gcElig.status==='N/A'?'':'bad'}">${ev.gcElig.status}: ${ev.gcElig.detail}</div>
        </details>
        <details class="advanced"><summary>Open Access eligibility</summary>
          <p style="font-size:11.5px;color:var(--text-dim);margin-top:8px;">${ev.oaElig.detail}</p>

      </div>

      <div class="card">
        <div class="cardHead"><h3>BESS operating strategy</h3></div>
        <label class="field"><div class="flabel"><span>Strategy</span></div>
          <select data-bind="inp.bessOp.strategy" data-type="select">

            <option value="mincost" ${inp.bessOp.strategy==='mincost'?'selected':''}>Minimum-cost — charge from cheapest available hours</option>
            <option value="peak" ${inp.bessOp.strategy==='peak'?'selected':''}>Peak shaving — discharge only above a load threshold</option>
            <option value="arbitrage" ${inp.bessOp.strategy==='arbitrage'?'selected':''}>Tariff arbitrage — charge cheap ToD hours, discharge expensive hours</option>
            <option value="custom" ${inp.bessOp.strategy==='custom'?'selected':''}>Custom charge/discharge windows</option>
          </select>
        </label>
        <div class="cardHead" style="margin-top:6px;margin-bottom:6px;"><h3 style="font-size:10.5px;">Permitted charge sources</h3></div>
        <div class="row">
          ${['solar','wind','grid','oa','gc'].map(s=>`<label class="checkRow"><input type="checkbox" data-bind="inp.bessOp.chargeSources.${s}" data-type="checkbox" ${inp.bessOp.chargeSources[s]?'checked':''}/> ${SRC_LABELS[s]}</label>`).join('')}

          <label class="field"><div class="flabel"><span>Discharge hours</span></div><input type="text" placeholder="e.g. 18,19,20,21" value="${inp.bessOp.customWindows.dischargeHours}" data-bind="inp.bessOp.customWindows.dischargeHours" data-type="text"/></label>
        </div>`:''}
        <p style="font-size:11px;color:var(--text-faint);margin-top:10px;">Solar and wind never charge the load directly when a strategy routes them through BESS first — dispatch enforces the priority order set in Phase 1 (${priorityArrayFrom(inp.priority).join(' → ')}).</p>

          <div class="row" style="margin-top:10px;">
            <label class="field"><div class="flabel"><span>Round-trip efficiency</span><span class="fval">${inp.b_rte}%</span></div><input type="range" min="70" max="98" value="${inp.b_rte}" data-bind="inp.b_rte"/></label>
            <label class="field"><div class="flabel"><span>Usable SOC band</span><span class="fval">${inp.b_soc}%</span></div><input type="range" min="50" max="100" value="${inp.b_soc}" data-bind="inp.b_soc"/></label>
          </div>
          <div class="row">
            <label class="field"><div class="flabel"><span>Annual degradation</span><span class="fval">${inp.b_deg}%</span></div><input type="range" min="0" max="8" step="0.1" value="${inp.b_deg}" data-bind="inp.b_deg"/></label>
            <label class="field"><div class="flabel"><span>Replacement at year</span><span class="fval">${inp.b_life}</span></div><input type="range" min="5" max="15" value="${inp.b_life}" data-bind="inp.b_life"/></label>
          </div>
        </details>
      </div>
    </div>

    <div class="viewGrid">
      ${procurementCard('grid','Conventional Grid', inp)}
      ${procurementCard('oa','Open Access', inp)}
      ${procurementCard('gc','Group Captive', inp)}
    </div>
  </div>
  `;
}
function capField(label, bindPath, val, min, max, step, unit){
  return `<label class="field"><div class="flabel"><span>${label}</span><span class="fval">${fmt(val,1)} ${unit}</span></div>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-bind="${bindPath}"/></label>`;
}
function bessCrateOK(c){ if(c.bessMWh<=0) return true; const cr = c.bessMW/c.bessMWh; return cr>=STATE.inp.b_cratemin-1e-9 && cr<=STATE.inp.b_cratemax+1e-9; }

function procurementCard(key, label, inp){
  const cfg = inp.procState[key];
  const baseline = computeFlatBaseline(inp, key);
  return `
  <div class="card">
    <div class="cardHead"><h3>${label} tariff</h3><span class="hint">₹/kWh</span></div>
    <div class="toggleGroup" style="margin-bottom:12px;">
      <button class="${cfg.mode==='flat'?'active':''}" data-action="setTariffMode:${key}:flat">Flat</button>
      <button class="${cfg.mode==='tod'?'active':''}" data-action="setTariffMode:${key}:tod">Time-of-Day</button>
    </div>
    ${key==='grid'? gridChargesEditor(inp) : key==='oa' ? oaChargesEditor(inp) : gcChargesEditor(inp)}
    ${cfg.mode==='tod' ? todSlotEditor(key, cfg, baseline) : ''}
    <details class="advanced"><summary>Custom additional charges (₹/kWh)</summary>
      ${(cfg.customCharges||[]).map((cc,i)=>`
        <div class="rowCard"><input type="text" placeholder="Label" value="${cc.label||''}" data-bind="inp.procState.${key}.customCharges[${i}].label" data-type="text"/>
        <input class="rc-num" type="number" step="0.01" value="${cc.value||0}" data-bind="inp.procState.${key}.customCharges[${i}].value" data-type="number"/>
        <button class="btn ghost sm" data-action="removeCharge:${key}:${i}">✕</button></div>`).join('')}
      <button class="btn sm" style="margin-top:8px;" data-action="addCharge:${key}">+ Add charge (enter 0 if not applicable)</button>
    </details>
  </div>`;
}
function gridChargesEditor(inp){

  <div class="row"><label class="field"><div class="flabel"><span>Fixed charge</span><span class="fval">₹${fmt(inp.g_fixed,0)}/mo</span></div><input type="range" min="0" max="50000" step="500" value="${inp.g_fixed}" data-bind="inp.g_fixed"/></label>
  <label class="field"><div class="flabel"><span>Excess-demand penalty</span><span class="fval">₹${fmt(inp.g_excess_demand,0)}/kVA</span></div><input type="range" min="0" max="2000" step="10" value="${inp.g_excess_demand}" data-bind="inp.g_excess_demand"/></label></div>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function recomputeScenario(inp, candidate){
  // Always recompute from stored inputs rather than trusting a frozen result —
  // so a later engine fix (or any input drift) is reflected immediately
  // instead of leaving stale numbers on old saved scenarios.
  const units = getUnitShapes(inp);
  const baseDemand = getBaseDemand8760(inp);
  const gridCapMW = gridCapacityMW(inp, inp.g_upgrade_avail);
  const ev = evaluateCandidateSteadyState(inp, units, baseDemand, candidate, gridCapMW);
  const finExact = computeExactMultiYearFinancing(inp, units, baseDemand, candidate, gridCapMW);
  return {ev, finExact};
}
function saveScenario(){
  const {ev} = STATE._cache;
  const name = prompt('Scenario name', architectureNameOf(ev)+' — '+scenarioPresets[STATE.inp.scenario].label);
  if(!name) return;
  STATE.scenarios.push({ id:Date.now(), name, inp:deepClone(STATE.inp), candidate:deepClone(STATE.candidate), ts:new Date().toLocaleString('en-IN') });
  if(STATE.tab2!=='scenarios') { STATE.tab2='scenarios'; }
  render();
}
function loadScenario(id){
  const s = STATE.scenarios.find(x=>x.id===+id); if(!s) return;
  STATE.inp = deepClone(s.inp); STATE.candidate = deepClone(s.candidate); STATE.editingScenarioId = s.id;
  STATE.tab2='architecture'; render();
}
function duplicateScenario(id){
  const s = STATE.scenarios.find(x=>x.id===+id); if(!s) return;
  const copy = { id:Date.now(), name:s.name+' (copy)', inp:deepClone(s.inp), candidate:deepClone(s.candidate), ts:new Date().toLocaleString('en-IN') };
  STATE.scenarios.push(copy);
  loadScenario(copy.id);
}
function deleteScenario(id){ STATE.scenarios = STATE.scenarios.filter(x=>x.id!==+id); render(); }

function viewScenarios(){
  const list = STATE.scenarios;
  const {ev, finExact} = STATE._cache;
  const current = {id:'current', name:'Current (unsaved) — '+architectureNameOf(ev), ev, finExact, ts:'now'};
  // Recompute every saved scenario fresh from its stored inputs on every render,
  // rather than trusting a frozen result — so engine fixes/input edits are
  // always reflected instead of leaving stale numbers on old scenarios.
  const savedComputed = list.map(s=>{
    const {ev:sev, finExact:sfin} = recomputeScenario(s.inp, s.candidate);
    return {...s, ev:sev, finExact:sfin};
  });
  const all = [current, ...savedComputed];
  const maxNPV = Math.max(...all.map(s=>isFinite(s.finExact.npvEquity)?s.finExact.npvEquity:0), 1);
  return `
  <h2 class="sectionTitle">Scenarios</h2>
  <p class="sectionDesc">Duplicate the current architecture, change assumptions in the Architecture tab, save again, and compare side-by-side on renewable share, landed cost and returns.</p>
  ${list.length===0 ? `<div class="card emptyState"><div class="big">⎘</div><p>No saved scenarios yet. Use <strong>+ Save scenario</strong> in the top bar to snapshot the current architecture, then adjust assumptions and save again to compare.</p></div>` : ''}
  <div class="card">
    <div class="cardHead"><h3>Comparison</h3></div>
    <table class="dataTable">
      <thead><tr><th>Scenario</th><th class="num">Ren. share</th><th class="num">Landed ₹/kWh</th><th class="num">CAPEX Cr</th><th class="num">Project IRR</th><th class="num">Equity IRR</th><th class="num">NPV Cr</th><th class="num">DSCR</th><th class="num">Payback</th><th></th></tr></thead>
      <tbody>
      ${all.map(s=>`
        <tr class="scenRow ${STATE.editingScenarioId===s.id?'active':''}">
          <td>${s.name}<br/><span style="font-size:10px;color:var(--text-faint)">${s.ts}</span></td>
          <td class="num">${fmt(s.ev.renShare,0)}%</td>
          <td class="num">₹${fmt(s.ev.landedCostPerKWh,2)}</td>
          <td class="num">${fmt(s.finExact.totalCapexCr,1)}</td>
          <td class="num">${irrLabel(s.finExact.projectIRR)}</td>
          <td class="num">${irrLabel(s.finExact.equityIRR)}</td>
          <td class="num">${fmt(s.finExact.npvEquity,1)}</td>
          <td class="num">${isNaN(s.finExact.avgDSCR)?'—':fmt(s.finExact.avgDSCR,2)+'x'}</td>
          <td class="num">${isNaN(s.finExact.payback)?'—':fmt(s.finExact.payback,1)+'y'}</td>
          <td>${s.id!=='current'?`<button class="btn ghost sm" data-action="loadScenario:${s.id}">Edit</button><button class="btn ghost sm" data-action="duplicateScenario:${s.id}">Copy</button><button class="btn ghost sm" data-action="deleteScenario:${s.id}">✕</button>`:''}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  ${all.length>1?`
  <div class="card" style="margin-top:18px;">
    <div class="cardHead"><h3>Equity NPV comparison</h3><span class="hint">₹ Cr</span></div>
    <div class="chartWrap">${stackedBarChart({categories:all.map(s=>s.name.length>18?s.name.slice(0,16)+'…':s.name), series:[{name:'NPV',data:all.map(s=>isFinite(s.finExact.npvEquity)?s.finExact.npvEquity:0),color:'var(--accent)'}], height:240})}</div>
  </div>`:''}
  `;
}

</script>
</body>
</html>
