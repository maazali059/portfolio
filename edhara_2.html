<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENERGYNEX — Charging Infrastructure Energy &amp; Investment Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ENERGYNEX — DESIGN SYSTEM
   Control-room / instrumentation aesthetic for an infrastructure
   planning tool. Not a product landing page.
   ============================================================ */
:root{
  --bg:            #0A0F16;
  --bg-raised:     #0F1620;
  --panel:         #121A25;
  --panel-2:       #16202C;
  --line:          #223040;
  --line-soft:     #1A2532;
  --text:          #E7ECF2;
  --text-dim:      #8DA0B3;
  --text-faint:    #56677A;
  --accent:        #35D6C4;
  --accent-dim:    #1F8B80;
  --warn:          #E8A33D;
  --bad:           #E2607A;
  --good:          #4CC48A;

  --c-solar:  #E8A33D;
  --c-wind:   #4FC3D9;
  --c-grid:   #7C8896;
  --c-oa:     #4CC48A;
  --c-gc:     #8C93E8;
  --c-bess:   #D9587A;
  --c-load:   #E7ECF2;

  --radius: 3px;
  --radius-lg: 6px;
  --font-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-display: 'Space Grotesk', var(--font-ui);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:13.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

::selection{ background:var(--accent-dim); color:#03110F; }
a{ color:var(--accent); }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; }

.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.hidden{ display:none !important; }

/* ---------------- top chrome ---------------- */
#appHeader{
  height:52px; display:flex; align-items:center; gap:16px;
  padding:0 18px; border-bottom:1px solid var(--line); background:var(--bg-raised);
  position:sticky; top:0; z-index:40;
}
.brand{ display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:15.5px; letter-spacing:.01em; }
.brand-mark{ width:20px; height:20px; position:relative; }
.brand-mark svg{ width:100%; height:100%; display:block; }
.brand-sub{ color:var(--text-faint); font-size:11px; font-weight:400; margin-left:2px; letter-spacing:.06em; text-transform:uppercase; }
#appHeader .spacer{ flex:1; }
.headerStat{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; padding:0 12px; border-left:1px solid var(--line-soft); }
.headerStat .v{ font-family:var(--font-mono); font-size:13px; color:var(--text); }
.headerStat .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; }

/* ---------------- phase nav (wizard, Phase 1) ---------------- */
#phase1Nav{ display:flex; gap:0; border-bottom:1px solid var(--line); background:var(--bg-raised); padding:0 18px; }
.stepTab{
  display:flex; align-items:center; gap:9px; padding:13px 20px; cursor:pointer;
  border-bottom:2px solid transparent; color:var(--text-faint); user-select:none;
}
.stepTab .num{ font-family:var(--font-mono); font-size:11px; width:20px; height:20px; border-radius:50%; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--text-faint); }
.stepTab.active{ color:var(--text); border-bottom-color:var(--accent); }
.stepTab.active .num{ border-color:var(--accent); color:var(--accent); background:rgba(53,214,196,.08); }
.stepTab.done .num{ border-color:var(--good); color:var(--good); }
.stepTab .label{ font-size:13px; font-weight:500; }
.stepTab .sub{ font-size:10.5px; color:var(--text-faint); }

/* ---------------- phase2 tab bar ---------------- */
#phase2Nav{ display:flex; gap:4px; border-bottom:1px solid var(--line); background:var(--bg-raised); padding:0 18px; overflow-x:auto; }
.wsTab{ padding:11px 16px; font-size:12.5px; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; letter-spacing:.01em; }
.wsTab:hover{ color:var(--text-dim); }
.wsTab.active{ color:var(--text); border-bottom-color:var(--accent); }

/* ---------------- summary strip (Phase 2) ---------------- */
#archSummary{
  display:flex; align-items:center; gap:0; padding:10px 18px; background:var(--panel);
  border-bottom:1px solid var(--line); flex-wrap:wrap; row-gap:8px;
}
#archSummary .archName{ font-size:12.5px; color:var(--text); font-weight:500; margin-right:16px; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sumKpi{ display:flex; flex-direction:column; gap:1px; padding:0 14px; border-left:1px solid var(--line-soft); }
.sumKpi:first-of-type{ border-left:none; }
.sumKpi .v{ font-family:var(--font-mono); font-size:14px; }
.sumKpi .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.scenarioPicker{ margin-left:auto; display:flex; align-items:center; gap:8px; }

/* ---------------- layout ---------------- */
#app{ display:flex; flex-direction:column; min-height:100vh; }
main{ flex:1; padding:22px 24px 60px; max-width:1400px; margin:0 auto; width:100%; }
.viewGrid{ display:grid; grid-template-columns: 1fr; gap:18px; }
.cols2{ display:grid; grid-template-columns: 1.1fr .9fr; gap:18px; align-items:start; }
.cols3{ display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
.colsAuto{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
@media (max-width: 980px){ .cols2, .cols3{ grid-template-columns:1fr; } }

/* ---------------- cards / panels ---------------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:16px 18px;
}
.card + .card{ margin-top:0; }
.cardHead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:10px; }
.cardHead h3{ margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); font-weight:600; }
.cardHead .hint{ font-size:11px; color:var(--text-faint); }
h2.sectionTitle{ font-family:var(--font-display); font-size:19px; font-weight:600; margin:0 0 4px; }
p.sectionDesc{ color:var(--text-dim); font-size:12.5px; margin:0 0 18px; max-width:74ch; }

/* ---------------- form controls ---------------- */
label.field{ display:block; margin-bottom:12px; }
label.field .flabel{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
label.field .flabel .fval{ font-family:var(--font-mono); color:var(--text); }
input[type=text],input[type=number],select,textarea{
  width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--text);
  padding:7px 9px; border-radius:var(--radius); font-size:12.5px; outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(53,214,196,.15); }
input[type=range]{ width:100%; accent-color:var(--accent); height:4px; background:transparent; }
.row{ display:flex; gap:10px; }
.row > *{ flex:1; }
.checkRow{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); }
.checkRow input{ accent-color:var(--accent); }
.toggleGroup{ display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.toggleGroup button{ flex:1; padding:7px 10px; background:var(--bg-raised); border:none; color:var(--text-dim); cursor:pointer; font-size:12px; border-right:1px solid var(--line); }
.toggleGroup button:last-child{ border-right:none; }
.toggleGroup button.active{ background:rgba(53,214,196,.12); color:var(--accent); }

button.btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 16px;
  border-radius:var(--radius); cursor:pointer; font-size:12.5px; font-weight:500; letter-spacing:.01em;
}
button.btn:hover{ border-color:var(--accent-dim); }
button.btn.primary{ background:var(--accent); border-color:var(--accent); color:#03110F; font-weight:600; }
button.btn.primary:hover{ background:#4FE6D3; }
button.btn.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:5px 8px; font-size:11.5px; }
button.btn.ghost:hover{ color:var(--text); }
button.btn.sm{ padding:5px 9px; font-size:11px; }
button.btn:disabled{ opacity:.4; cursor:not-allowed; }

details.advanced{ margin-top:8px; border-top:1px dashed var(--line-soft); padding-top:10px; }
details.advanced > summary{ cursor:pointer; font-size:11.5px; color:var(--accent-dim); list-style:none; display:flex; align-items:center; gap:6px; }
details.advanced > summary::-webkit-details-marker{ display:none; }
details.advanced > summary:before{ content:'▸'; font-size:9px; }
details.advanced[open] > summary:before{ content:'▾'; }
details.advanced > summary:hover{ color:var(--accent); }

/* ---------------- kpi + pill ---------------- */
.kpi{ background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
.kpi .kv{ font-family:var(--font-mono); font-size:20px; color:var(--text); }
.kpi .kv .unit{ font-size:11px; color:var(--text-faint); margin-left:3px; }
.kpi .kl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }
.kpi .ksub{ font-size:10.5px; color:var(--text-dim); margin-top:4px; }
.kpi.good .kv{ color:var(--good); } .kpi.bad .kv{ color:var(--bad); } .kpi.warn .kv{ color:var(--warn); }

.pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim); }
.pill.good{ border-color:rgba(76,196,138,.4); color:var(--good); background:rgba(76,196,138,.08); }
.pill.bad{ border-color:rgba(226,96,122,.4); color:var(--bad); background:rgba(226,96,122,.08); }
.pill.warn{ border-color:rgba(232,163,61,.4); color:var(--warn); background:rgba(232,163,61,.08); }
.dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

/* ---------------- tables ---------------- */
table.dataTable{ width:100%; border-collapse:collapse; font-size:12px; }
table.dataTable th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line); }
table.dataTable td{ padding:7px 8px; border-bottom:1px solid var(--line-soft); color:var(--text-dim); }
table.dataTable td.num,table.dataTable th.num{ text-align:right; font-family:var(--font-mono); }
table.dataTable tr:hover td{ color:var(--text); }
table.dataTable td input{ padding:4px 6px; font-size:12px; }

/* ---------------- vehicle / slot rows ---------------- */
.rowCard{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line-soft); }
.rowCard:last-child{ border-bottom:none; }
.rowCard .rc-name{ flex:1.6; }
.rowCard .rc-num{ flex:1; }

/* ---------------- candidate cards (Decision step) ---------------- */
.candCard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:10px; position:relative; }
.candCard.best{ border-color:var(--accent-dim); box-shadow:0 0 0 1px rgba(53,214,196,.25) inset; }
.candCard .rank{ position:absolute; top:14px; right:16px; font-family:var(--font-mono); font-size:10px; color:var(--text-faint); }
.candCard h4{ margin:0; font-size:14px; font-weight:600; padding-right:50px; }
.candMix{ display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--bg-raised); }
.candMix span{ height:100%; }
.candLegend{ display:flex; flex-wrap:wrap; gap:8px; font-size:10px; color:var(--text-faint); }
.candKpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:4px; }
.candKpis div{ background:var(--bg-raised); border-radius:var(--radius); padding:8px 9px; }
.candKpis .v{ font-family:var(--font-mono); font-size:14px; }
.candKpis .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }

/* ---------------- SVG chart containers ---------------- */
.chartWrap{ width:100%; overflow:visible; }
.chartWrap svg{ width:100%; height:auto; display:block; overflow:visible; font-family:var(--font-mono); }
.axisLabel{ fill:var(--text-faint); font-size:9px; }
.gridLine{ stroke:var(--line-soft); stroke-width:1; }

/* ---------------- flow diagram ---------------- */
.flowNode rect,.flowNode circle{ stroke-width:1.2; }
.flowNode text{ font-family:var(--font-mono); font-size:10.5px; fill:var(--text); }
.flowNode .lbl{ font-family:var(--font-ui); font-size:9.5px; fill:var(--text-faint); }
.flowEdge{ fill:none; opacity:.55; }
.flowEdge.dash{ stroke-dasharray:3 4; animation:flowmove 1.6s linear infinite; }
@keyframes flowmove{ to{ stroke-dashoffset:-14; } }

/* ---------------- scenario table ---------------- */
.scenRow.active td{ background:rgba(53,214,196,.06); }

/* ---------------- footer nav buttons ---------------- */
.stepFooter{ display:flex; justify-content:space-between; margin-top:22px; }

/* ---------------- scrollbar ---------------- */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}

.emptyState{ text-align:center; padding:40px 20px; color:var(--text-faint); }
.emptyState .big{ font-size:28px; margin-bottom:8px; }

@media (max-width: 700px){
  main{ padding:16px 12px 50px; }
  .candKpis{ grid-template-columns:1fr 1fr; }
}

</style>
</head>
<body>
<div id="app">
  <header id="appHeader"></header>
  <nav id="phase1Nav"></nav>
  <nav id="phase2Nav" class="hidden"></nav>
  <div id="archSummary" class="hidden"></div>
  <main><div id="mainContent"></div></main>
</div>
<script>
/* ============================================================
   E-DHARA CANONICAL 8760-HOUR ENGINE
   Pure functions, no DOM. Testable in Node, then embedded as-is
   into the browser build.
   ============================================================ */

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- 8760 timeline (built once, constant) ---------------- */
function generate8760Timeline(){
  const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const timeline=[];
  let idx=0, doy=0;
  for(let m=0;m<12;m++){
    for(let d=1; d<=daysInMonth[m]; d++){
      for(let h=0; h<24; h++){
        timeline.push({idx, month:m, monthName:monthNames[m], day:d, hour:h, doy, dow:doy%7});
        idx++;
      }
      doy++;
    }
  }
  return timeline; // length 8760 exactly (non-leap synthetic year)
}
const TIMELINE_8760 = generate8760Timeline();
const HOURS_PER_YEAR = TIMELINE_8760.length; // 8760

/* ---------------- operating-day mask ----------------
   `opdays` no longer multiplies a 24h representative day into an annual
   number. Instead it determines, inside the 8760 profile itself, which
   of the 365 days actually see charging demand (spread evenly across
   the year via a Bresenham-style accumulator, not bunched at the start).
   This keeps opdays meaningful without it being the annual-total formula. */
function operatingDayMask(opdays){
  const totalDays=365;
  const on = new Array(totalDays).fill(false);
  const frac = clamp(opdays,0,365)/totalDays;
  let acc=0;
  for(let d=0; d<totalDays; d++){
    acc+=frac;
    if(acc>=0.999999){ on[d]=true; acc-=1; }
  }
  return on;
}

/* ---------------- 24h shape helper (reused inside 8760 generation) ---------------- */
function shapeArray(shape){
  const flat = Array(24).fill(1/24);
  if(shape==='flat') return flat;
  const arr = Array(24).fill(0);
  if(shape==='daytime'){ for(let h=8;h<18;h++) arr[h]=1; }
  else if(shape==='evening'){ for(let h=16;h<23;h++) arr[h]=1; for(let h=8;h<16;h++) arr[h]=0.4; }
  else if(shape==='night'){ for(let h=0;h<6;h++) arr[h]=1; for(let h=20;h<24;h++) arr[h]=0.8; for(let h=6;h<20;h++) arr[h]=0.25; }
  else return flat;
  const s = arr.reduce((a,b)=>a+b,0);
  return arr.map(v=>v/s);
}

/* ---------------- DEMAND 8760 (terminal / steady-state) ----------------
   dailyKWhTotal: steady-state daily energy (kWh) from the vehicle table.
   Returns an 8760-length MWh/hour array representing TERMINAL demand.
   Multiply elementwise by a scalar utilisation fraction for a given
   project year — this is the ONLY place annual demand is derived, and
   it is NOT `24h-day-total * opdays`; opdays instead zeroes out
   non-operating days inside the full 365-day/8760-hour array. */
function generateDemand8760Profile(dailyKWhTotal, shape, opdays){
  const hourWeights = shapeArray(shape); // sums to 1 across 24h
  const mask = operatingDayMask(opdays);
  const out = new Float64Array(HOURS_PER_YEAR);
  for(let h=0; h<HOURS_PER_YEAR; h++){
    const t = TIMELINE_8760[h];
    if(!mask[t.doy]){ out[h]=0; continue; }
    out[h] = (dailyKWhTotal * hourWeights[t.hour]) / 1000; // kWh -> MWh
  }
  return out;
}

/* ---------------- SOLAR / WIND unit-MW 8760 shapes ----------------
   Synthetic, deterministic, clearly labelled placeholders. Built to
   auto-scale so the annual energy from 1 MW installed capacity equals
   exactly 8760 * (CUF%) MWh, matching the CUF input the user enters —
   the shape distributes that energy across a solar bell-curve day and
   a seasonal multiplier (India-generic, NOT a specific site/weather
   dataset), rather than repeating one flat day 365 times. */
const SOLAR_SEASONAL = [0.92,0.98,1.08,1.12,1.10,0.92,0.78,0.80,0.92,1.02,1.00,0.94]; // Jan..Dec, avg ~1.0
const WIND_SEASONAL   = [0.75,0.70,0.75,0.95,1.25,1.55,1.60,1.45,1.05,0.75,0.65,0.65]; // pre/monsoon-heavy, avg ~1.0

function _normalizeSeasonal(arr){
  const daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
  const weighted = arr.reduce((s,v,i)=>s+v*daysInMonth[i],0)/365;
  return arr.map(v=>v/weighted);
}
const SOLAR_SEASONAL_N = _normalizeSeasonal(SOLAR_SEASONAL);
const WIND_SEASONAL_N  = _normalizeSeasonal(WIND_SEASONAL);

function solarDayCurve(hour){
  const x=(hour-12)/6.5;
  return Math.max(0, Math.exp(-x*x*2.2));
}
function windDayCurve(hour){
  return Math.max(0, 0.85+0.3*Math.sin((hour-3)/24*2*Math.PI));
}

/* returns an 8760 MWh/hour array for 1 MW installed capacity, rescaled
   so its annual sum == 8760*(cufPct/100) MWh exactly. */
function generateUnitMWShape8760(cufPct, kind){
  const raw = new Float64Array(HOURS_PER_YEAR);
  const dayFn = kind==='wind' ? windDayCurve : solarDayCurve;
  const seasonal = kind==='wind' ? WIND_SEASONAL_N : SOLAR_SEASONAL_N;
  for(let h=0; h<HOURS_PER_YEAR; h++){
    const t = TIMELINE_8760[h];
    raw[h] = dayFn(t.hour) * seasonal[t.month];
  }
  const rawSum = raw.reduce((s,v)=>s+v,0);
  const targetAnnual = HOURS_PER_YEAR*(cufPct/100);
  const scale = rawSum>0 ? targetAnnual/rawSum : 0;
  const out = new Float64Array(HOURS_PER_YEAR);
  for(let h=0;h<HOURS_PER_YEAR;h++) out[h]=raw[h]*scale;
  return out; // MWh/hour per 1 MW installed
}

function scaleProfile(unitShape, mw){
  const out = new Float64Array(HOURS_PER_YEAR);
  for(let h=0;h<HOURS_PER_YEAR;h++) out[h]=unitShape[h]*mw;
  return out;
}
function addProfiles(...profiles){
  const out = new Float64Array(HOURS_PER_YEAR);
  for(const p of profiles) for(let h=0;h<HOURS_PER_YEAR;h++) out[h]+=p[h];
  return out;
}
function constProfile(mw){
  const out = new Float64Array(HOURS_PER_YEAR);
  out.fill(mw);
  return out;
}

/* ---------------- OA availability profile ----------------
   OA is now a real hourly-available energy source, not an annual
   blended ₹/kWh adjustment. `oaMW` = contracted capacity; `oaShape`
   selects whether the contracted block behaves like solar-shaped,
   wind-shaped, or firm round-the-clock (flat) supply — an explicit,
   editable MODEL ASSUMPTION about the OA generator's profile, not a
   regulatory fact. */
function generateOA8760Profile(oaMW, oaShape, solarUnitShape, windUnitShape){
  if(oaMW<=0) return new Float64Array(HOURS_PER_YEAR);
  if(oaShape==='wind') return scaleProfile(windUnitShape, oaMW);
  if(oaShape==='flat') return constProfile(oaMW);
  return scaleProfile(solarUnitShape, oaMW); // default solar-shaped
}

/* ---------------- GC generation + entitlement profile ----------------
   Ownership/equity %, energy entitlement %, and actual self-consumption
   are kept as three distinct numbers (never collapsed):
   - gcGenProfile8760: SPV's own physical generation (solar+wind mix)
   - gcEntitlementPct: contractual/assumed share of that generation
     allocated to this site's energy account — an explicit editable
     assumption field, independent of equity %.
   - actual self-consumption is measured AFTER dispatch (how much of
     the entitled energy the site could actually use). */
function generateGC8760Profiles(gcMW, solarSharePct, solarUnitShape, windUnitShape, entitlementPct){
  const solarMW = gcMW*(solarSharePct/100);
  const windMW = gcMW*(1-solarSharePct/100);
  const genProfile = addProfiles(scaleProfile(solarUnitShape, solarMW), scaleProfile(windUnitShape, windMW));
  const availProfile = new Float64Array(HOURS_PER_YEAR);
  const frac = clamp(entitlementPct,0,100)/100;
  for(let h=0;h<HOURS_PER_YEAR;h++) availProfile[h]=genProfile[h]*frac;
  return {genProfile, availProfile};
}

/* ---------------- HOURLY TARIFF BUILDER ----------------
   Converts a Flat or Time-of-Day tariff definition into an 8760-length
   ₹/kWh array so dispatch can use the ACTUAL applicable price for each
   hour, never an annual average. ToD pattern repeats identically every
   day (slots are hour-of-day, not date-specific) — this matches how
   DISCOM/OA/GC ToD tariffs are actually published.
   slots: [{start:0, end:6, rate:3.2}, ...] — start/end are hour-of-day
   integers 0-24, non-wrapping (a 22:00-02:00 slot must be entered as
   two slots: 22-24 and 0-2). Later slots overwrite earlier ones on
   overlap (last-write-wins), so the caller controls precedence. Hours
   not covered by any slot fall back to flatValue. */
function buildHourlyTariff(mode, flatValue, slots){
  const hourRate = new Array(24).fill(flatValue);
  if(mode==='tod' && Array.isArray(slots)){
    for(const slot of slots){
      const start = clamp(Math.round(slot.start),0,24);
      const end = clamp(Math.round(slot.end),0,24);
      for(let h=start; h<end; h++){ if(h>=0&&h<24) hourRate[h]=slot.rate; }
    }
  }
  const out = new Float64Array(HOURS_PER_YEAR);
  for(let h=0; h<HOURS_PER_YEAR; h++) out[h]=hourRate[TIMELINE_8760[h].hour];
  return out;
}

/* ---------------- BESS SCHEDULE (strategy -> which hours-of-day are
   used for economic Grid/OA/GC charging, and which hours discharge is
   restricted to) ----------------
   Computed ONCE per dispatch call (not per-hour) from the 24-hour ToD
   pattern, since tariffs are daily-periodic by construction above.
   This is a deterministic, explainable heuristic (cheapest N hours /
   priciest N hours, N sized off MWh/MW), consistent with the coarse
   grid-search style already used by the optimiser elsewhere in this
   model — NOT a full forward-looking stochastic optimisation. */
function computeBessSchedule(bessMW, bessMWh, tariffs, strategy, sources, customWindows, rte){
  if(strategy==='custom' && customWindows){
    return {
      chargeHours: new Set(customWindows.chargeHours||[]),
      dischargeRestrict: (customWindows.dischargeHours && customWindows.dischargeHours.length) ? new Set(customWindows.dischargeHours) : null
    };
  }
  if(!strategy || strategy==='renewable'){
    return {chargeHours:new Set(), dischargeRestrict:null}; // no Grid/OA/GC->BESS charging
  }
  // Two distinct price signals: which hours are cheap enough to CHARGE from
  // (gated by which sources are permitted to charge the battery) vs which
  // hours are expensive enough to justify DISCHARGING to avoid import (this
  // just needs to know the price of whatever would otherwise serve the load,
  // independent of whether that pathway is an allowed charge source).
  const priceAtCharge = h=>{
    let best = Infinity;
    if(sources && sources.grid && tariffs.grid) best = Math.min(best, tariffs.grid[h]);
    if(sources && sources.oa && tariffs.oa) best = Math.min(best, tariffs.oa[h]);
    if(sources && sources.gc && tariffs.gc) best = Math.min(best, tariffs.gc[h]);
    return best;
  };
  const priceAtDischarge = h=> tariffs.grid ? tariffs.grid[h] : Infinity; // grid is the last-resort source peak-shaving avoids; OA/GC are served ahead of BESS regardless of price
  const chargeHoursArr = Array.from({length:24},(_,h)=>({h, price:priceAtCharge(h)})).filter(x=>isFinite(x.price));
  const dischargeHoursArr = Array.from({length:24},(_,h)=>({h, price:priceAtDischarge(h)})).filter(x=>isFinite(x.price));
  if(chargeHoursArr.length===0 && dischargeHoursArr.length===0) return {chargeHours:new Set(), dischargeRestrict:null};
  const ascending = [...chargeHoursArr].sort((a,b)=>a.price-b.price);
  const descending = [...dischargeHoursArr].sort((a,b)=>b.price-a.price);
  const hoursToFill = bessMW>0 ? clamp(Math.ceil(bessMWh/bessMW),1,12) : 0;
  const cheapest = ascending.slice(0,hoursToFill);
  const priciest = descending.slice(0,hoursToFill);
  const avgCheap = cheapest.length ? cheapest.reduce((s,x)=>s+x.price,0)/cheapest.length : Infinity;
  const avgExpensive = priciest.length ? priciest.reduce((s,x)=>s+x.price,0)/priciest.length : 0;
  const effRte = rte>0 ? rte : 1;
  // worth charging only if the avoided peak cost clears round-trip losses
  // with a small margin — otherwise arbitrage would lose money after RTE.
  const worthwhile = cheapest.length>0 && avgExpensive > (avgCheap/effRte)*1.02;

  if(strategy==='mincost'){
    return {chargeHours: worthwhile ? new Set(cheapest.map(x=>x.h)) : new Set(), dischargeRestrict:null};
  }
  if(strategy==='peak'){
    return {chargeHours:new Set(), dischargeRestrict: priciest.length ? new Set(priciest.map(x=>x.h)) : null};
  }
  if(strategy==='arbitrage'){
    return {chargeHours: worthwhile ? new Set(cheapest.map(x=>x.h)) : new Set(), dischargeRestrict: priciest.length ? new Set(priciest.map(x=>x.h)) : null};
  }
  return {chargeHours:new Set(), dischargeRestrict:null};
}

/* ================================================================
   CANONICAL 8760 DISPATCH
   Priority order over ['solar','wind','gc','oa','bess'] to meet demand;
   'grid' always resolves last, hard-capped at gridCapMW; unmet demand
   after the grid cap is recorded as unserved energy — never silently
   imported. BESS also gets an explicit charging pass fed only by
   OWNED surplus renewable (solar+wind) left over after demand is met,
   consistent with dispatch priority — GC/OA surplus is not assumed
   curtailable at this site since it is procured, not owned generation.
   Runs for all 8760 hours in one pass; `collectHourly` controls whether
   full per-hour arrays are retained (needed for charts) or only
   monthly/annual aggregates are accumulated (used by the optimizer for
   speed across many candidates).
   ================================================================ */
function runDispatch8760(profiles, params, collectHourly){
  const {demand, solar, wind, gcAvail, oaAvail} = profiles;
  const n = demand.length;
  const priority = params.priorityOrder || ['solar','wind','gc','oa','bess','grid'];
  const demandPriority = priority.filter(p=>p!=='grid'); // grid always resolved last regardless of position

  const socMin = params.bessMWh*params.socMinFrac;
  const socMax = params.bessMWh*params.socMaxFrac;
  let soc = params.bessMWh*0.5;

  // Economic BESS scheduling (Grid/OA/GC charging + discharge windows).
  // Fully backward-compatible: if the caller doesn't pass bessChargeSources
  // (existing callers never do), schedule.chargeHours is empty and
  // dischargeRestrict is null, so behaviour is IDENTICAL to before.
  const rte = (params.chargeEff||1)*(params.dischargeEff||1);
  const schedule = computeBessSchedule(
    params.bessMW, params.bessMWh, params.tariffs||{}, params.bessStrategy,
    params.bessChargeSources, params.customWindows, rte
  );

  const tariffs = params.tariffs||{};
  const monthly = Array.from({length:12},()=>({
    demand:0, solar:0, wind:0, gc:0, oa:0, bessCharge:0, bessDischarge:0, grid:0, gridForBess:0, curtail:0, unserved:0,
    bessChargeRenewable:0, bessChargeGrid:0, bessChargeOA:0, bessChargeGC:0,
    gridEnergyCostRs:0, oaEnergyCostRs:0, gcEnergyCostRs:0, bessGridCostRs:0, bessOACostRs:0, bessGCCostRs:0
  }));
  let peakGridMW = 0;
  let peakGridNeedMW = 0;
  const hourly = collectHourly ? [] : null;

  for(let h=0; h<n; h++){
    const t = TIMELINE_8760[h];
    let need = demand[h];
    const totalDemandThisHour = need;
    let solarAvail = solar[h], windAvail = wind[h], gcAv = gcAvail[h], oaAv = oaAvail[h];
    let solarUsed=0, windUsed=0, gcUsed=0, oaUsed=0, bessDis=0, gridUsed=0;

    for(const src of demandPriority){
      if(need<=1e-9) break;
      if(src==='solar'){ const u=Math.min(solarAvail,need); solarUsed+=u; need-=u; solarAvail-=u; }
      else if(src==='wind'){ const u=Math.min(windAvail,need); windUsed+=u; need-=u; windAvail-=u; }
      else if(src==='gc'){ const u=Math.min(gcAv,need); gcUsed+=u; need-=u; gcAv-=u; }
      else if(src==='oa'){ const u=Math.min(oaAv,need); oaUsed+=u; need-=u; oaAv-=u; }
      else if(src==='bess'){
        const hourAllowed = !schedule.dischargeRestrict || schedule.dischargeRestrict.has(t.hour);
        if(hourAllowed){
          const maxDis = Math.max(0, Math.min(params.bessMW, (soc-socMin)*params.dischargeEff));
          const u = Math.min(maxDis, need);
          if(u>0){ bessDis+=u; need-=u; soc-=u/params.dischargeEff; }
        }
      }
    }
    // grid resolves last, hard-capped — track the UNCAPPED requirement too,
    // so any unserved energy can be explained honestly (peakGridMW itself is
    // always <= gridCapMW by construction and can never "exceed" it).
    peakGridNeedMW = Math.max(peakGridNeedMW, Math.max(need,0));
    gridUsed = Math.min(params.gridCapMW, Math.max(need,0));
    let unserved = Math.max(need-gridUsed, 0);

    // BESS charging pass 1: leftover OWNED renewable surplus (unchanged from
    // before), only if we did not already discharge this hour (no same-hour
    // charge+discharge).
    // BESS charging pass 1: leftover OWNED renewable surplus, gated by which
    // sources are actually permitted to charge the battery (solar/wind
    // toggles) — surplus from a disallowed source is curtailed, not forced
    // into the battery via the other allowed source's headroom.
    let bessChgRenewable=0, curtail=0;
    const chgSrc = params.bessChargeSources||{};
    const solarSurplus = (chgSrc.solar!==false) ? solarAvail : 0;
    const windSurplus = (chgSrc.wind!==false) ? windAvail : 0;
    const totalSurplus = solarAvail + windAvail;
    const chargeableSurplus = solarSurplus + windSurplus;
    if(bessDis<=1e-9 && chargeableSurplus>1e-9 && soc<socMax){
      const headroomMWh = (socMax-soc)/params.chargeEff;
      const maxChg = Math.min(params.bessMW, chargeableSurplus, headroomMWh);
      bessChgRenewable = Math.max(0,maxChg);
      soc += bessChgRenewable*params.chargeEff;
    }
    curtail = Math.max(totalSurplus-bessChgRenewable,0);

    // BESS charging pass 2: economic Grid/OA/GC charging, ONLY during the
    // strategy's chargeHours window (empty by default -> no effect on any
    // existing caller). Draws from whatever import capacity is left after
    // demand was served this hour: (gridCapMW - gridUsed) for grid, and the
    // leftover of the same OA/GC availability profile used for demand.
    // NOTE: gridUsed above is DEMAND-serving grid only, and stays that way —
    // it feeds the hourly energy-balance equation (demand = solar+wind+gc+
    // oa+bessDischarge+grid+unserved). Grid drawn to charge BESS is tracked
    // separately (gridForBess) and added back only when checking the
    // sanctioned import cap, never into the demand-balance `grid` field.
    let bessChgGrid=0, bessChgOA=0, bessChgGC=0, gridForBess=0;
    if(bessDis<=1e-9 && soc<socMax && schedule.chargeHours.has(t.hour) && params.bessChargeSources){
      const candidates=[];
      if(params.bessChargeSources.grid){
        const gridLeft = Math.max(0, params.gridCapMW-gridUsed);
        if(gridLeft>1e-9) candidates.push({src:'grid', avail:gridLeft, price:tariffs.grid?tariffs.grid[h]:Infinity});
      }
      if(params.bessChargeSources.oa && oaAv>1e-9) candidates.push({src:'oa', avail:oaAv, price:tariffs.oa?tariffs.oa[h]:Infinity});
      if(params.bessChargeSources.gc && gcAv>1e-9) candidates.push({src:'gc', avail:gcAv, price:tariffs.gc?tariffs.gc[h]:Infinity});
      candidates.sort((a,b)=>a.price-b.price);
      const headroomMWh = (socMax-soc)/params.chargeEff;
      let remaining = Math.max(0, Math.min(params.bessMW-bessChgRenewable, headroomMWh));
      for(const c of candidates){
        if(remaining<=1e-9) break;
        const u = Math.min(c.avail, remaining);
        if(u<=1e-9) continue;
        if(c.src==='grid'){ gridForBess+=u; bessChgGrid+=u; }
        else if(c.src==='oa'){ oaAv-=u; bessChgOA+=u; }
        else if(c.src==='gc'){ gcAv-=u; bessChgGC+=u; }
        soc += u*params.chargeEff;
        remaining -= u;
      }
    }
    const bessChg = bessChgRenewable+bessChgGrid+bessChgOA+bessChgGC;
    const gridTotalImport = gridUsed+gridForBess; // demand + BESS charging, for cap/peak/cost purposes

    peakGridMW = Math.max(peakGridMW, gridTotalImport);

    // Hourly-priced procurement cost: actual metered ₹, not an annual-average
    // proxy. Uses the same tariffs array the BESS scheduler consumed, so a
    // ToD/flat rate structure now changes the money, not just the schedule.
    const gRate = tariffs.grid ? tariffs.grid[h] : 0;
    const oRate = tariffs.oa ? tariffs.oa[h] : 0;
    const cRate2 = tariffs.gc ? tariffs.gc[h] : 0;
    const gridEnergyCostRs = gridUsed*1000*gRate;
    const bessGridCostRs = gridForBess*1000*gRate;
    const oaEnergyCostRs = oaUsed*1000*oRate;
    const bessOACostRs = bessChgOA*1000*oRate;
    const gcEnergyCostRs = gcUsed*1000*cRate2;
    const bessGCCostRs = bessChgGC*1000*cRate2;

    const m = t.month;
    monthly[m].demand += totalDemandThisHour;
    monthly[m].solar += solarUsed;
    monthly[m].wind += windUsed;
    monthly[m].gc += gcUsed;
    monthly[m].oa += oaUsed;
    monthly[m].bessCharge += bessChg;
    monthly[m].bessChargeRenewable += bessChgRenewable;
    monthly[m].bessChargeGrid += bessChgGrid;
    monthly[m].bessChargeOA += bessChgOA;
    monthly[m].bessChargeGC += bessChgGC;
    monthly[m].bessDischarge += bessDis;
    monthly[m].grid += gridUsed;
    monthly[m].gridForBess += gridForBess;
    monthly[m].curtail += curtail;
    monthly[m].unserved += unserved;
    monthly[m].gridEnergyCostRs += gridEnergyCostRs;
    monthly[m].oaEnergyCostRs += oaEnergyCostRs;
    monthly[m].gcEnergyCostRs += gcEnergyCostRs;
    monthly[m].bessGridCostRs += bessGridCostRs;
    monthly[m].bessOACostRs += bessOACostRs;
    monthly[m].bessGCCostRs += bessGCCostRs;

    if(collectHourly){
      hourly.push({idx:h, month:t.month, day:t.day, hour:t.hour,
        demand:totalDemandThisHour, solar:solarUsed, wind:windUsed, gc:gcUsed, oa:oaUsed,
        bessCharge:bessChg, bessChargeRenewable:bessChgRenewable, bessChargeGrid:bessChgGrid, bessChargeOA:bessChgOA, bessChargeGC:bessChgGC,
        bessDischarge:bessDis, grid:gridUsed, gridForBess, gridTotal:gridTotalImport, unserved, curtail, soc, socMin, socMax});
    }
  }

  const annual = monthly.reduce((s,m)=>({
    demand:s.demand+m.demand, solar:s.solar+m.solar, wind:s.wind+m.wind, gc:s.gc+m.gc, oa:s.oa+m.oa,
    bessCharge:s.bessCharge+m.bessCharge, bessDischarge:s.bessDischarge+m.bessDischarge,
    bessChargeRenewable:s.bessChargeRenewable+m.bessChargeRenewable, bessChargeGrid:s.bessChargeGrid+m.bessChargeGrid,
    bessChargeOA:s.bessChargeOA+m.bessChargeOA, bessChargeGC:s.bessChargeGC+m.bessChargeGC,
    grid:s.grid+m.grid, gridForBess:s.gridForBess+m.gridForBess, curtail:s.curtail+m.curtail, unserved:s.unserved+m.unserved,
    gridEnergyCostRs:s.gridEnergyCostRs+m.gridEnergyCostRs, oaEnergyCostRs:s.oaEnergyCostRs+m.oaEnergyCostRs,
    gcEnergyCostRs:s.gcEnergyCostRs+m.gcEnergyCostRs, bessGridCostRs:s.bessGridCostRs+m.bessGridCostRs,
    bessOACostRs:s.bessOACostRs+m.bessOACostRs, bessGCCostRs:s.bessGCCostRs+m.bessGCCostRs
  }), {demand:0,solar:0,wind:0,gc:0,oa:0,bessCharge:0,bessDischarge:0,bessChargeRenewable:0,bessChargeGrid:0,bessChargeOA:0,bessChargeGC:0,grid:0,gridForBess:0,curtail:0,unserved:0,
    gridEnergyCostRs:0,oaEnergyCostRs:0,gcEnergyCostRs:0,bessGridCostRs:0,bessOACostRs:0,bessGCCostRs:0});

  return {monthly, annual, peakGridMW, peakGridNeedMW, hourly};
}

   ============================================================ */
const fmt = (n, d=2) => { if(!isFinite(n)) return "—"; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0}); };

  downside: {util:0.80, grid:1.05, bess:1.10, price:0.92, interest:100, ren:0.90, label:"Downside"},
  upside:   {util:1.20, grid:0.97, bess:0.90, price:1.08, interest:-50, ren:1.05, label:"Upside"},
  stress:   {util:0.70, grid:1.30, bess:1.25, price:0.85, interest:300, ren:0.85, label:"Stress Case"},
};
function scenMult(inp){
  const p = scenarioPresets[inp.scenario] || scenarioPresets.base;
  return {
    util:   p.util   * (1+(inp.st_util||0)/100),
    grid:   p.grid   * (1+(inp.st_grid||0)/100),
    bess:   p.bess   * (1+(inp.st_bess||0)/100),

    interest: p.interest + (inp.st_int||0),

}

/* ---------------- finance primitives ---------------- */
function crf(ratePct, years){ const r=ratePct/100; if(r===0) return 1/years; return r*Math.pow(1+r,years)/(Math.pow(1+r,years)-1); }
function npv(ratePct, flows){ const r=ratePct/100; return flows.reduce((s,cf,t)=>s+cf/Math.pow(1+r,t),0); }
function irrLabel(v){ if(isNaN(v)) return '—'; if(!isFinite(v)) return '>2000%'; return fmt(v,1)+'%'; }
function irr(flows){
  let lo=-0.99, hi=20.0;
  const f = r => flows.reduce((s,cf,t)=>s+cf/Math.pow(1+r,t),0);
  let flo=f(lo), fhi=f(hi);
  if(isNaN(flo)||isNaN(fhi)) return NaN;
  if(flo*fhi>0) return flo>0 ? Infinity : NaN;
  for(let i=0;i<100;i++){
    const mid=(lo+hi)/2, fm=f(mid);
    if(Math.abs(fm)<1e-6) return mid*100;
    if(flo*fm<0){ hi=mid; fhi=fm; } else { lo=mid; flo=fm; }
  }
  return ((lo+hi)/2)*100;
}
function genEngine(mw, capexCrPerMW, omLakhPerMW, life, hurdlePct){
  const capexCr = mw*capexCrPerMW;
  const annualCapexCharge = capexCr>0 ? capexCr*crf(hurdlePct,life) : 0;
  const annualOM = mw*omLakhPerMW/100;
  return {capexCr, annualCapexCharge, annualOM};
}

/* ---------------- misc helpers ---------------- */

  if(key==='solar-wind-oa-gc-bess-grid') return ['solar','wind','oa','gc','bess','grid'];
  if(key==='solar-wind-bess-gc-oa-grid') return ['solar','wind','bess','gc','oa','grid'];
  return ['solar','wind','gc','oa','bess','grid'];
}
function utilisationFraction(inp, year){
  const y1 = clampV(inp.util_y1,0,1000)/100, term = clampV(inp.util_terminal,0,1000)/100;
  const rampY = Math.max(inp.util_rampyears,1);
  if(year>=rampY) return term;
  const t = (year-1)/rampY;
  if(inp.util_shape==='scurve'){ const s=t*t*(3-2*t); return y1+(term-y1)*s; }
  return y1 + (term-y1)*t;
}
function parseHourList(str){

/* ---------------- procurement pathways: OA / Grid / GC ---------------- */
function computeOA(inp){
  const base = inp.oa_energy+inp.oa_trans+inp.oa_wheel+inp.oa_css+inp.oa_addl+inp.oa_bank+inp.oa_sldc+inp.oa_tax;
  const landed0 = base/(1-inp.oa_loss/100);
  const extra = customChargeSum(inp.procState.oa.customCharges);
  const landed = extra===0 ? landed0 : landed0 + extra/(1-inp.oa_loss/100);
  return {landed, breakdown:{
    "PPA / energy":inp.oa_energy,"Transmission":inp.oa_trans,"Wheeling":inp.oa_wheel,"Cross-subsidy surcharge":inp.oa_css,
    "Additional surcharge":inp.oa_addl,"Banking":inp.oa_bank,"SLDC/scheduling":inp.oa_sldc,"Taxes/levies":inp.oa_tax,
    "Loss add-on":landed0-base, ...(extra? {"Custom charges":extra/(1-inp.oa_loss/100)}:{})
  }};
}
function gridCapacityMW(inp, includeUpgrade){
  if(inp.gridAllowed===false) return 0; // hard constraint: no grid import permitted at all
  const base = inp.g_sanc/1000;
  if(includeUpgrade && inp.g_upgrade_avail) return base+inp.g_upgrade_mw;
  return base;
}
function computeGridCostEngine(inp, gridMWhAnnual, peakGridMW){
  const m = scenMult(inp);
  const hourWeights = shapeArray(inp.shape);
  const PEAK_HOURS = [7,8,9,10,18,19,20,21];
  const SOLAR_HOURS = [11,12,13,14,15,16];
  let peakW=0, solarW=0;
  PEAK_HOURS.forEach(h=>peakW+=hourWeights[h]);
  SOLAR_HOURS.forEach(h=>solarW+=hourWeights[h]);
  const baseEnergyRate = inp.g_energy*m.grid;
  const touAdj = peakW*(inp.g_tod||0) - solarW*(inp.g_solardisc||0);
  const fppcaRate = (inp.g_fppca||0)*m.grid;
  const effectiveEnergyRate = (baseEnergyRate+touAdj+fppcaRate)*(1+inp.g_tax/100);
  const sanctionedMW = (inp.g_sanc||0)/1000;
  const billableKVA = Math.max(peakGridMW,0)*1000;
  const normalKVA = Math.min(billableKVA, sanctionedMW*1000);
  const excessKVA = Math.max(billableKVA-sanctionedMW*1000, 0);
  const demandChargeAnnualCr = (inp.g_demand*normalKVA*12)/1e7;
  const excessDemandChargeAnnualCr = (inp.g_excess_demand*excessKVA*12)/1e7;
  const fixedAnnualCr = (inp.g_fixed*12)/1e7;
  const extra = customChargeSum(inp.procState.grid.customCharges);
  const demandFixedPerKWh = gridMWhAnnual>0 ? ((demandChargeAnnualCr+excessDemandChargeAnnualCr+fixedAnnualCr)*1e7*(1+inp.g_tax/100))/(gridMWhAnnual*1e6) : 0;
  const connAmortRate = inp.g_conn_amort||0;
  const effectivePerKWh = effectiveEnergyRate+demandFixedPerKWh+connAmortRate+extra;
  const totalAnnualCostCr = (effectivePerKWh*gridMWhAnnual*1000)/1e7;
  return {
    baseEnergyRate, touAdj, fppcaRate, effectiveEnergyRate, demandChargeAnnualCr, excessDemandChargeAnnualCr, excessKVA, fixedAnnualCr,
    connAmortRate, customChargeRate:extra, demandFixedPerKWh, effectivePerKWh, totalAnnualCostCr, peakHourWeight:peakW, solarHourWeight:solarW,
    allocationNote:'Demand + excess-demand + fixed charges are apportioned over this architecture\'s own annual grid-import energy from the dispatch. ToU peak/solar-hour incidence uses the site\'s demand SHAPE as an hour-weighting proxy, not a full hour-by-hour ToU billing pass — a model allocation assumption, not a regulatory fact.'
  };
}
function gridRatePerKWh(inp, gridMWhAnnual, peakGridMW){ return computeGridCostEngine(inp, gridMWhAnnual, peakGridMW).effectivePerKWh; }
function gcCompliance(inp, gcMW, gcAnnualUsedGWh, gcAnnualGenGWh){
  const equityOK = inp.gc_myequity>=inp.gc_equity;
  const selfConsPct = gcAnnualGenGWh>0 ? clampV((gcAnnualUsedGWh/gcAnnualGenGWh)*100,0,999) : 0;
  const selfConsOK = selfConsPct>=inp.gc_selfcons;
  return {equityOK, selfConsOK, compliant:equityOK&&selfConsOK, selfConsPct};
}
function oaEligibility(inp, candidate){
  if(candidate.oaMW<=1e-6) return {status:'N/A', detail:'No Open Access capacity proposed for this candidate'};
  if(inp.oa_min_mw<=1e-6) return {status:'VERIFY', detail:'No minimum-capacity threshold configured — set the threshold or confirm eligibility manually against the state open-access regulation'};
  if(candidate.oaMW < inp.oa_min_mw) return {status:'NOT ELIGIBLE', detail:`${fmt(candidate.oaMW,2)} MW is below the configured minimum eligible OA capacity of ${fmt(inp.oa_min_mw,2)} MW`};
  return {status:'ELIGIBLE', detail:`${fmt(candidate.oaMW,2)} MW meets the configured ${fmt(inp.oa_min_mw,2)} MW minimum-capacity threshold. Voltage-level / consumer-category / distance criteria are not modeled and still require confirmation.`};
}
function gcEligibility(inp, candidate, gcAnnualUsedMWh, gcAnnualGenMWh){
  if(candidate.gcMW<=1e-6) return {status:'N/A', detail:'No Group Captive capacity proposed for this candidate', compliant:true, selfConsPct:0};
  const compl = gcCompliance(inp, candidate.gcMW, gcAnnualUsedMWh, gcAnnualGenMWh);
  if(!compl.equityOK) return {status:'NOT ELIGIBLE', detail:`Equity stake ${fmt(inp.gc_myequity,1)}% is below the configured minimum captive-consumer equity threshold of ${fmt(inp.gc_equity,1)}%`, compliant:false, selfConsPct:compl.selfConsPct};
  if(!compl.selfConsOK) return {status:'NOT ELIGIBLE', detail:`Actual self-consumption ${fmt(compl.selfConsPct,1)}% (from dispatch) is below the configured minimum of ${fmt(inp.gc_selfcons,1)}%`, compliant:false, selfConsPct:compl.selfConsPct};
  return {status:'ELIGIBLE', detail:`Equity ${fmt(inp.gc_myequity,1)}%≥${fmt(inp.gc_equity,1)}% and self-consumption ${fmt(compl.selfConsPct,1)}%≥${fmt(inp.gc_selfcons,1)}% both meet the configured thresholds. Confirm threshold values against the current Electricity Rules.`, compliant:true, selfConsPct:compl.selfConsPct};
}
function computeGCFullyLoaded(inp, gcMW, gcConsumedMWh, gcElig){
  const life = (inp.s_life*(inp.gc_solarshare/100) + inp.w_life*(1-inp.gc_solarshare/100)) || 25;
  const omBlendLakhPerMW = (inp.s_om*(inp.gc_solarshare/100) + inp.w_om*(1-inp.gc_solarshare/100));
  const gcCapexTotalCr = gcMW*inp.gc_capex;
  const myShare = clampV(inp.gc_myequity,0,100)/100;
  const gcMyCapexCr = gcCapexTotalCr*myShare;
  const capexAnnualCr = gcMyCapexCr>0 ? gcMyCapexCr*crf(inp.f_hurdle, life) : 0;
  const omAnnualCr = gcMW*myShare*omBlendLakhPerMW/100;
  const captiveOK = !!(gcElig && gcElig.compliant);
  const cssApplied = captiveOK ? 0 : inp.oa_css;
  const addlApplied = captiveOK ? 0 : inp.oa_addl;
  const gcMWh = Math.max(gcConsumedMWh,0);
  const capexPerKWh = gcMWh>1e-6 ? (capexAnnualCr*1e7)/(gcMWh*1000) : 0;
  const omPerKWh = gcMWh>1e-6 ? (omAnnualCr*1e7)/(gcMWh*1000) : 0;
  const extra = customChargeSum(inp.procState.gc.customCharges);
  const variableBase = inp.oa_wheel + inp.oa_bank + inp.oa_sldc + inp.gc_charges + cssApplied + addlApplied;
  const variableLanded = variableBase/(1-inp.oa_loss/100);
  const lossAddOn = variableLanded-variableBase;
  const customLanded = extra>0 ? extra/(1-inp.oa_loss/100) : 0;
  const deliveredPerKWh = capexPerKWh+omPerKWh+variableLanded+customLanded;
  return {
    captiveOK, capexAnnualCr, omAnnualCr, capexPerKWh, omPerKWh, variableLanded, deliveredPerKWh,
    breakdown:{
      "Generation CAPEX (annualised, equity share)":capexPerKWh, "O&M (equity share)":omPerKWh,
      "Wheeling":inp.oa_wheel, "Banking":inp.oa_bank, "SLDC/scheduling":inp.oa_sldc,
      "GC variable/pass-through charges":inp.gc_charges,
      "Cross-subsidy surcharge":cssApplied, "Additional surcharge":addlApplied,
      "Loss add-on":lossAddOn, ...(customLanded? {"Custom charges":customLanded}:{})
    },
    note: captiveOK
      ? 'Captive benefit assumed: CSS/Additional Surcharge waived — the eligibility gate (equity ≥ threshold AND self-consumption ≥ threshold, checked against ACTUAL dispatch) is currently met.'
      : 'Captive benefit NOT available: CSS/Additional Surcharge applied because the captive-eligibility gate is not currently met.'
  };
}

/* ---------------- hourly tariff build (for BESS scheduling AND actual hourly billing) ----------------
   Baselines here represent the full per-kWh ENERGY rate actually metered each
   hour (capacity/demand charges stay separate — they're billed on sanctioned
   kVA, not per-kWh, so they remain an annual allocation, not an hourly one). */
function computeFlatBaseline(inp, key){
  const m = scenMult(inp);
  if(key==='grid') return (inp.g_energy*m.grid + (inp.g_fppca||0)*m.grid)*(1+inp.g_tax/100);
  if(key==='oa')   return computeOA(inp).landed;
  // GC: variable/pass-through rate only (capex+O&M annuity is settled separately,
  // post-dispatch, since it depends on annual consumed MWh). Assumes captive
  // eligibility (CSS/Additional Surcharge waived) for this per-hour baseline —
  // the eligibility gate itself is still checked and shown against actual
  // dispatch in the Architecture/Economics tabs.
  if(key==='gc')   return inp.oa_wheel+inp.oa_bank+inp.oa_sldc+inp.gc_charges;
  return 0;
}
function buildAllTariffs(inp){
  const tariffs = {};
  ['grid','oa','gc'].forEach(key=>{
    const cfg = inp.procState[key];
    const baseline = computeFlatBaseline(inp, key);
    const slots = (cfg.slots||[]).map(sl=>({start:sl.start, end:sl.end, rate:(sl.rate==null||sl.rate==='')?baseline:parseFloat(sl.rate)}));
    tariffs[key] = buildHourlyTariff(cfg.mode, baseline, slots);
  });
  return tariffs;
}
/* Actual metered cost, derived from the dispatch's hour-by-hour tariff × energy
   accumulation — this is what Finance/Economics use, replacing the old
   annual-blended-rate proxy so a ToD structure actually changes the ₹ figure. */
function computeGridActualCost(inp, a, peakGridMW){
  const sanctionedMW = (inp.g_sanc||0)/1000;
  const billableKVA = Math.max(peakGridMW,0)*1000;
  const normalKVA = Math.min(billableKVA, sanctionedMW*1000);
  const excessKVA = Math.max(billableKVA-sanctionedMW*1000, 0);
  const demandChargeAnnualCr = (inp.g_demand*normalKVA*12)/1e7;
  const excessDemandChargeAnnualCr = (inp.g_excess_demand*excessKVA*12)/1e7;
  const fixedAnnualCr = (inp.g_fixed*12)/1e7;
  const capacityChargesCr = (demandChargeAnnualCr+excessDemandChargeAnnualCr+fixedAnnualCr)*(1+inp.g_tax/100);
  const gridMWh = (a.grid||0) + (a.bessChargeGrid||0);
  const connAmortCr = gridMWh>0 ? (inp.g_conn_amort*gridMWh*1000)/1e7 : 0;
  const extra = customChargeSum(inp.procState.grid.customCharges);
  const customCr = gridMWh>0 ? (extra*gridMWh*1000)/1e7 : 0;
  const energyCostCr = ((a.gridEnergyCostRs||0)+(a.bessGridCostRs||0))/1e7;
  const totalCr = energyCostCr+capacityChargesCr+connAmortCr+customCr;
  const effectivePerKWh = gridMWh>0 ? (totalCr*1e7)/(gridMWh*1000) : 0;
  return {energyCostCr, capacityChargesCr, connAmortCr, customCr, totalCr, effectivePerKWh, gridMWh, excessKVA, demandChargeAnnualCr, excessDemandChargeAnnualCr, fixedAnnualCr};
}
function computeOAActualCost(inp, a){
  const oaMWh = (a.oa||0)+(a.bessChargeOA||0);
  const totalCr = ((a.oaEnergyCostRs||0)+(a.bessOACostRs||0))/1e7;
  const effectivePerKWh = oaMWh>0 ? (totalCr*1e7)/(oaMWh*1000) : 0;
  return {totalCr, effectivePerKWh, oaMWh};
}
function computeGCVariableActualCost(inp, a){
  const gcMWh = (a.gc||0)+(a.bessChargeGC||0);
  const totalCr = ((a.gcEnergyCostRs||0)+(a.bessGCCostRs||0))/1e7;
  const effectivePerKWh = gcMWh>0 ? (totalCr*1e7)/(gcMWh*1000) : 0;
  return {totalCr, effectivePerKWh, gcMWh};
}

/* ---------------- demand / RE unit shapes ---------------- */
function getUnitShapes(inp){
  const solarUnit = generateUnitMWShape8760(inp.s_cuf,'solar');
  const windUnit = generateUnitMWShape8760(inp.w_cuf,'wind');
  return {solarUnit, windUnit};
}
function getBaseDemand8760(inp){
  const dailyKWhTotal = inp.vehicles.reduce((s,r)=>s+r.vpd*r.spd*r.kwh,0);
  return generateDemand8760Profile(dailyKWhTotal, inp.shape, inp.opdays);
}
function mulScalar(profile, k){ const out=new Float64Array(profile.length); for(let i=0;i<profile.length;i++) out[i]=profile[i]*k; return out; }
function sumProfile(p){ let s=0; for(let i=0;i<p.length;i++) s+=p[i]; return s; }

function buildCandidateProfiles(inp, units, baseDemand8760, candidate, utilFrac){
  const m = scenMult(inp);
  const demand = utilFrac===1 ? baseDemand8760 : mulScalar(baseDemand8760, utilFrac);
  const solar = mulScalar(scaleProfile(units.solarUnit, candidate.solarMW), m.ren);
  const wind = mulScalar(scaleProfile(units.windUnit, candidate.windMW), m.ren);
  const oaAvail = generateOA8760Profile(candidate.oaMW, inp.oa_shape, units.solarUnit, units.windUnit);
  const gc = generateGC8760Profiles(candidate.gcMW, inp.gc_solarshare, units.solarUnit, units.windUnit, inp.gc_entitlement);
  return {demand, solar, wind, gcAvail:gc.availProfile, oaAvail, gcGenProfile:gc.genProfile};
}
function dispatchParamsFor(inp, candidate, gridCapMW){
  const bandHalfGapPct = (100-inp.b_soc)/2/100;
  const chargeEff = Math.sqrt(inp.b_rte/100), dischargeEff = chargeEff;
  const tariffs = buildAllTariffs(inp);
  return {
    priorityOrder: priorityArrayFrom(inp.priority),
    bessMW: candidate.bessMW, bessMWh: candidate.bessMWh,
    socMinFrac: bandHalfGapPct, socMaxFrac: 1-bandHalfGapPct,
    chargeEff, dischargeEff, gridCapMW, tariffs,
    bessStrategy: inp.bessOp.strategy, bessChargeSources: inp.bessOp.chargeSources,
    customWindows: { chargeHours: parseHourList(inp.bessOp.customWindows.chargeHours), dischargeHours: parseHourList(inp.bessOp.customWindows.dischargeHours) }
  };
}
function runCandidateDispatch(inp, units, baseDemand8760, candidate, utilFrac, gridCapMW, collectHourly){
  const profiles = buildCandidateProfiles(inp, units, baseDemand8760, candidate, utilFrac);
  const params = dispatchParamsFor(inp, candidate, gridCapMW);
  const result = runDispatch8760(profiles, params, collectHourly);
  return {result, profiles};
}

/* ---------------- steady-state single-year evaluation ---------------- */
function evaluateCandidateSteadyState(inp, units, baseDemand8760, candidate, gridCapMW){
  const {result, profiles} = runCandidateDispatch(inp, units, baseDemand8760, candidate, 1.0, gridCapMW, false);
  const a = result.annual;
  const servedMWh = a.demand - a.unserved;
  const renShare = a.demand>0 ? ((a.solar+a.wind+a.gc+a.oa+a.bessDischarge)/a.demand)*100 : 0;
  const gcGenAnnualMWh = sumProfile(profiles.gcGenProfile);
  const sol = genEngine(candidate.solarMW, inp.s_capex, inp.s_om, inp.s_life, inp.f_hurdle);
  const win = genEngine(candidate.windMW, inp.w_capex, inp.w_om, inp.w_life, inp.f_hurdle);
  const gcCapexTotalCr = candidate.gcMW*inp.gc_capex;
  const gcMyEquityCapexCr = gcCapexTotalCr*(inp.gc_myequity/100);
  const oa = computeOA(inp);
  const gridActual = computeGridActualCost(inp, a, result.peakGridMW);
  const oaActual = computeOAActualCost(inp, a);
  const gcVarActual = computeGCVariableActualCost(inp, a);
  const solarOM_perKWh = a.solar>0 ? (sol.annualOM*1e7)/(a.solar*1000) : 0;
  const windOM_perKWh = a.wind>0 ? (win.annualOM*1e7)/(a.wind*1000) : 0;
  // Actual metered hourly-billed cost (grid/OA/GC-variable) + flat O&M for owned generation.
  const energyCostCr = (a.solar*solarOM_perKWh + a.wind*windOM_perKWh)*1000/1e7 + gridActual.totalCr + oaActual.totalCr + gcVarActual.totalCr;
  const m = scenMult(inp);
  const bessCapexCr = candidate.bessMWh*inp.b_capex*m.bess + candidate.bessMW*inp.b_capex_mw*m.bess;
  const bessAnnualCr = bessCapexCr*crf(inp.f_hurdle,10) + bessCapexCr*(inp.b_om/100);
  const siteCapexCr = inp.e_chargercapex+inp.e_gridcapex+inp.e_civilcapex+(inp.g_upgrade_avail?inp.g_upgrade_capex:0);
  const renCapexCr = sol.capexCr+win.capexCr+gcMyEquityCapexCr;
  const totalCapexCr = (renCapexCr+bessCapexCr+siteCapexCr)*(1+inp.e_contg/100);
  const blendedPrice = (inp.e_price*(1-inp.e_fleetshare/100)+inp.e_fleetprice*(inp.e_fleetshare/100)+inp.e_greenprem)*m.price;
  const revenueCr = servedMWh*1000*blendedPrice/1e7;
  const omTotalCr = sol.annualOM+win.annualOM+bessAnnualCr+(siteCapexCr*0.03);
  const ebitdaCr = revenueCr - energyCostCr - omTotalCr;
  const landedCostPerKWh = servedMWh>0 ? (energyCostCr*1e7)/(servedMWh*1000) : 0;
  const debtCr = totalCapexCr*inp.f_debt/100, equityCr = totalCapexCr-debtCr;
  const rate = inp.f_rate + m.interest/100;
  const emiAnnualCr = debtCr>0 ? debtCr*crf(rate, inp.f_tenor) : 0;
  const interestY1 = debtCr*rate/100;
  const depY1 = totalCapexCr*inp.f_dep/100;
  const pbt = ebitdaCr-depY1-interestY1;
  const tax = Math.max(pbt,0)*inp.f_tax/100;
  const patY1 = pbt-tax;
  const proxyFlows = [-equityCr]; for(let y=1;y<=15;y++) proxyFlows.push(patY1+depY1-(emiAnnualCr-interestY1));
  const proxyEquityIRR = irr(proxyFlows);
  const proxyProjectFlows = [-totalCapexCr, ...Array(15).fill(ebitdaCr*(1-inp.f_tax/100)+depY1*inp.f_tax/100)];
  const proxyProjectIRR = irr(proxyProjectFlows);
  const proxyNPV = npv(inp.f_hurdle, proxyFlows);
  const dscrY1 = (interestY1+(emiAnnualCr-interestY1))>0 ? ebitdaCr/(interestY1+(emiAnnualCr-interestY1)) : NaN;
  const oaElig = oaEligibility(inp, candidate);
  const gcElig = gcEligibility(inp, candidate, a.gc, gcGenAnnualMWh);
  const gridFull = computeGridCostEngine(inp, a.grid, result.peakGridMW); // informational blended-rate breakdown (Economics tab display)
  const gcFull = computeGCFullyLoaded(inp, candidate.gcMW, a.gc, gcElig);
  const solarFullPerKWh = a.solar>0 ? solarOM_perKWh + (sol.annualCapexCharge*1e7)/(a.solar*1000) : 0;
  const windFullPerKWh = a.wind>0 ? windOM_perKWh + (win.annualCapexCharge*1e7)/(a.wind*1000) : 0;
  // Fully-loaded cost uses the ACTUAL metered Grid/OA/GC-variable rates (not the
  // blended proxy) plus GC's capex+O&M annuity, so this figure is consistent
  // with energyCostCr/ebitdaCr above rather than a separate estimate.
  const fullyLoadedCostCr = (a.solar*solarFullPerKWh + a.wind*windFullPerKWh)*1000/1e7 + gcFull.capexAnnualCr + gcFull.omAnnualCr + gcVarActual.totalCr + oaActual.totalCr + gridActual.totalCr;
  const fullyLoadedCostPerKWh = servedMWh>0 ? (fullyLoadedCostCr*1e7)/(servedMWh*1000) : 0;
  return {
    candidate, annual:a, servedMWh, renShare, unservedMWh:a.unserved, peakGridMW:result.peakGridMW, peakGridNeedMW:result.peakGridNeedMW,
    sanctionedMW:gridCapMW, totalCapexCr, equityCr, debtCr, revenueCr, energyCostCr, omTotalCr, ebitdaCr,
    landedCostPerKWh, proxyEquityIRR, proxyProjectIRR, proxyNPV, dscrY1,
    gcMyEquityCapexCr, gcCapexTotalCr, bessCapexCr, blendedPrice, gcGenAnnualMWh, oaElig, gcElig,
    oaLandedPerKWh: oa.landed, gridFull, gcFull, solarFullPerKWh, windFullPerKWh, fullyLoadedCostPerKWh,
    gridActual, oaActual, gcVarActual
  };
}
function architectureNameOf(ev){
  const c = ev.candidate; const parts=[];
  if(c.solarMW>0.01) parts.push(`${fmt(c.solarMW,1)} MW Solar`);
  if(c.windMW>0.01) parts.push(`${fmt(c.windMW,1)} MW Wind`);
  if(c.oaMW>0.01) parts.push(`${fmt(c.oaMW,1)} MW Green OA`);
  if(c.gcMW>0.01) parts.push(`${fmt(c.gcMW,1)} MW Group Captive`);
  if(c.bessMWh>0.01) parts.push(`${fmt(c.bessMWh,1)} MWh / ${fmt(c.bessMW,1)} MW BESS`);
  if(ev.annual.grid>0.01) parts.push('Grid backup');
  return parts.length? parts.join(' + ') : 'Grid only';
}

/* ---------------- BESS degradation + 15-yr exact financing ---------------- */
function bessDegradationSchedule(inp, bessMWh, years){
  const rows = []; let usableFrac=1.0, replaced=false, replacementYear=null;
  for(let y=1;y<=years;y++){
    usableFrac *= (1-inp.b_deg/100);
    const life_exceeded = y>=inp.b_life;
    const below_min = usableFrac*100 < inp.b_minusable;
    if(!replaced && (life_exceeded||below_min)){ replaced=true; replacementYear=y; usableFrac=1.0; }
    rows.push({y, usableFrac, usableMWh:bessMWh*usableFrac, replacedThisYear:replacementYear===y});
  }
  const replacementCapexCr = bessMWh*inp.b_capex*(inp.b_replcost/100);
  return {rows, replacementYear, replacementCapexCr};
}
function computeExactMultiYearFinancing(inp, units, baseDemand8760, candidate, gridCapMW){
  const m = scenMult(inp);
  const life=15;
  const sol = genEngine(candidate.solarMW, inp.s_capex, inp.s_om, inp.s_life, inp.f_hurdle);
  const win = genEngine(candidate.windMW, inp.w_capex, inp.w_om, inp.w_life, inp.f_hurdle);
  const gcCapexTotalCr = candidate.gcMW*inp.gc_capex;
  const gcMyEquityCapexCr = gcCapexTotalCr*(inp.gc_myequity/100);
  const oa = computeOA(inp);
  const siteCapexCr = inp.e_chargercapex+inp.e_gridcapex+inp.e_civilcapex+(inp.g_upgrade_avail?inp.g_upgrade_capex:0);
  const bessCapexCr = candidate.bessMWh*inp.b_capex*m.bess + candidate.bessMW*inp.b_capex_mw*m.bess;
  const renCapexCr = sol.capexCr+win.capexCr+gcMyEquityCapexCr;
  const totalCapexCr = (renCapexCr+bessCapexCr+siteCapexCr)*(1+inp.e_contg/100);
  const debtCr = totalCapexCr*inp.f_debt/100;
  const equityCr = totalCapexCr-debtCr;
  const rate = inp.f_rate + m.interest/100;
  const emiAnnualCr = debtCr>0 ? debtCr*crf(rate, inp.f_tenor) : 0;
  const blendedPrice = (inp.e_price*(1-inp.e_fleetshare/100)+inp.e_fleetprice*(inp.e_fleetshare/100)+inp.e_greenprem)*m.price;
  const degSched = bessDegradationSchedule(inp, candidate.bessMWh, life);
  const oaRate = oa.landed;
  const gcOpexRate = inp.gc_charges;
  let bookValue = totalCapexCr, debtBal = debtCr;
  const flowsEquity=[-equityCr]; const yearRows=[];
  for(let y=1;y<=life;y++){
    const utilFrac = clampV(utilisationFraction(inp, y)*m.util, 0, 3);
    const solDegFactor = Math.pow(1-inp.s_deg/100, y-1);
    const winDegFactor = Math.pow(1-inp.w_deg/100, y-1);
    const bessUsableFrac = degSched.rows[y-1].usableFrac;
    const yUnits = {solarUnit: units.solarUnit, windUnit: units.windUnit};
    const yCandidate = { solarMW: candidate.solarMW*solDegFactor, windMW: candidate.windMW*winDegFactor,
      bessMW: candidate.bessMW*bessUsableFrac, bessMWh: candidate.bessMWh*bessUsableFrac, oaMW: candidate.oaMW, gcMW: candidate.gcMW };
    const {result} = runCandidateDispatch(inp, yUnits, baseDemand8760, yCandidate, utilFrac, gridCapMW, false);
    const a = result.annual;
    const servedMWh = a.demand - a.unserved;
    const solarOM_perKWh = a.solar>0 ? (sol.annualOM*1e7)/(a.solar*1000) : 0;
    const windOM_perKWh = a.wind>0 ? (win.annualOM*1e7)/(a.wind*1000) : 0;
    const gridActualY = computeGridActualCost(inp, a, result.peakGridMW);
    const oaActualY = computeOAActualCost(inp, a);
    const gcVarActualY = computeGCVariableActualCost(inp, a);
    const energyCostCr = (a.solar*solarOM_perKWh + a.wind*windOM_perKWh)*1000/1e7 + gridActualY.totalCr + oaActualY.totalCr + gcVarActualY.totalCr;
    const rev = servedMWh*1000*blendedPrice/1e7 * Math.pow(1+inp.growth/100, Math.min(y-1,0));
    const bessOMCr = bessCapexCr*(inp.b_om/100);
    const siteOMCr = siteCapexCr*0.03;
    const opex = energyCostCr + sol.annualOM + win.annualOM + bessOMCr + siteOMCr;
    const ebitda = rev-opex;
    const dep = y<=life ? bookValue*inp.f_dep/100 : 0; bookValue-=dep;
    const interestCr = y<=inp.f_tenor ? debtBal*rate/100 : 0;
    const principal = y<=inp.f_tenor ? Math.max(emiAnnualCr-interestCr,0) : 0;
    debtBal = Math.max(debtBal-principal,0);
    const replCapexThisYear = degSched.replacementYear===y ? degSched.replacementCapexCr : 0;
    const pbt = ebitda-dep-interestCr;
    const tax = Math.max(pbt,0)*inp.f_tax/100;
    const pat = pbt-tax;
    const fcfe = pat+dep-principal-replCapexThisYear;
    flowsEquity.push(fcfe);
    const dscr = (interestCr+principal)>0 ? ebitda/(interestCr+principal) : NaN;
    yearRows.push({y, rev, opex, ebitda, dep, interestCr, principal, pat, fcfe, dscr, debtBal, replCapexThisYear,
      utilFrac, servedMWh, annual:a, energyCostCr, landedCostPerKWh: servedMWh>0 ? (energyCostCr*1e7)/(servedMWh*1000):0,
      solDegFactor, winDegFactor, bessUsableFrac});
  }
  const projectFlows = [-totalCapexCr, ...yearRows.map(r=>r.ebitda*(1-inp.f_tax/100)+r.dep*inp.f_tax/100-r.replCapexThisYear)];
  const equityIRR = irr(flowsEquity);
  const projectIRR = irr(projectFlows);
  const npvEquity = npv(inp.f_hurdle, flowsEquity);
  let cum=-equityCr, payback=NaN;
  for(let y=1;y<yearRows.length;y++){ cum+=yearRows[y].fcfe; if(cum>=0 && isNaN(payback)) payback=y; }
  if(isNaN(payback) && yearRows.length){ cum=-equityCr+yearRows[0].fcfe; if(cum>=0) payback=1; }
  const avgDSCR = yearRows.filter(r=>!isNaN(r.dscr)).reduce((s,r,_,a)=>s+r.dscr/a.length,0);
  const roic = totalCapexCr>0 ? (yearRows[0].ebitda/totalCapexCr)*100 : 0;
  const dscrOK = avgDSCR>=inp.f_mindscr;
  return {totalCapexCr, debtCr, equityCr, revenueCr:yearRows[0].rev, opexCr:yearRows[0].opex, ebitdaCr:yearRows[0].ebitda,
    equityIRR, projectIRR, npvEquity, payback, avgDSCR, roic, rows:yearRows, blendedPrice,
    landedCost:yearRows[0].landedCostPerKWh, dscrOK, replacementYear:degSched.replacementYear, replacementCapexCr:degSched.replacementCapexCr,
    gcMyEquityCapexCr, bessCapexCr, siteCapexCr, renCapexCr};
}

/* ---------------- coarse-to-exact architecture optimizer ---------------- */
const OPT_WEIGHTS = { LAMBDA_IRR:0.5, P_TARGET:0.02, P_DSCR:5, P_GRID:0.01, P_CURT:1.0, P_UNSERVED:2.0 };
function scoreCandidateEval(ev, inp){
  if(inp.gridAllowed===false && ev.annual.grid>0.01) return -Infinity;
  if(ev.oaElig.status==='NOT ELIGIBLE') return -Infinity;
  if(ev.gcElig.status==='NOT ELIGIBLE') return -Infinity;
  const W = OPT_WEIGHTS;
  const gridSharePct = ev.annual.demand>0 ? (ev.annual.grid/ev.annual.demand)*100 : 0;
  const reliabCeiling = inp.reliab==='high' ? 50 : 100;
  const penalty =
      W.P_TARGET * Math.pow(Math.max(0, inp.retarget-ev.renShare),2) * (ev.annual.demand/1000)
    + W.P_DSCR * Math.max(0, 1.20-(isNaN(ev.dscrY1)?1.20:ev.dscrY1)) * ev.totalCapexCr
    + W.P_GRID * Math.max(0, gridSharePct-reliabCeiling) * (ev.annual.demand/1000)
    + W.P_CURT * (ev.annual.curtail * (inp.s_capex*0.02))
    + W.P_UNSERVED * (ev.unservedMWh*(inp.e_price||10)/1000);
  const irrHeadroom = isFinite(ev.proxyProjectIRR) ? W.LAMBDA_IRR*Math.max(0,ev.proxyProjectIRR-inp.f_hurdle)*ev.totalCapexCr/100 : 0;
  const npvTerm = isFinite(ev.proxyNPV) ? ev.proxyNPV : -1e9;
  return npvTerm + irrHeadroom - penalty;
}
function scoreExactCandidate(ev, finExact, inp){
  if(inp.gridAllowed===false && ev.annual.grid>0.01) return -Infinity;
  if(ev.oaElig.status==='NOT ELIGIBLE') return -Infinity;
  if(ev.gcElig.status==='NOT ELIGIBLE') return -Infinity;
  const W = OPT_WEIGHTS;
  const gridSharePct = ev.annual.demand>0 ? (ev.annual.grid/ev.annual.demand)*100 : 0;
  const reliabCeiling = inp.reliab==='high' ? 50 : 100;
  const penalty =
      W.P_TARGET * Math.pow(Math.max(0, inp.retarget-ev.renShare),2) * (ev.annual.demand/1000)
    + W.P_DSCR * Math.max(0, 1.20-(isNaN(finExact.avgDSCR)?1.20:finExact.avgDSCR)) * finExact.totalCapexCr
    + W.P_GRID * Math.max(0, gridSharePct-reliabCeiling) * (ev.annual.demand/1000)
    + W.P_CURT * (ev.annual.curtail * (inp.s_capex*0.02))
    + W.P_UNSERVED * (ev.unservedMWh*(inp.e_price||10)/1000);
  const irrHeadroom = isFinite(finExact.projectIRR) ? W.LAMBDA_IRR*Math.max(0,finExact.projectIRR-inp.f_hurdle)*finExact.totalCapexCr/100 : 0;
  const npvTerm = isFinite(finExact.npvEquity) ? finExact.npvEquity : -1e9;
  return npvTerm + irrHeadroom - penalty;
}
function optimizeArchitecture(inp, units, baseDemand8760, gridCapMW, topKCount){
  const steps = (max,n) => { if(n<=1) return [max]; const arr=[]; for(let i=0;i<n;i++) arr.push(max*i/(n-1)); return arr; };
  const annualDemandGWh = sumProfile(baseDemand8760)/1000;
  const solarCeilMW = Math.max(inp.s_mw, annualDemandGWh>0 ? (annualDemandGWh*1000)/(8760*(inp.s_cuf/100)) : 0, 0.5);
  const windCeilMW  = Math.max(inp.w_mw, inp.w_cuf>0 ? (annualDemandGWh*1000)/(8760*(inp.w_cuf/100)) : 0, 0);
  const gcCeilMW    = Math.max(inp.gc_mw, 0.5);
  const oaCeilMW    = Math.max(inp.oa_mw, (annualDemandGWh*1000)/8760, 0.5);
  const solarOpts = steps(solarCeilMW, 3), windOpts = steps(windCeilMW, 2), oaOpts = steps(oaCeilMW, 2), gcOpts = steps(gcCeilMW, 2);
  const bessMWOpts  = steps(Math.max(inp.b_maxmw,0), 3);
  const bessMWhOpts = steps(Math.max(inp.b_maxmwh,0), 3);
  const bessCombos = [];
  for(const bessMWh of bessMWhOpts) for(const bessMW of bessMWOpts){
    if(bessMWh<=1e-6 && bessMW<=1e-6){ bessCombos.push({bessMW:0, bessMWh:0}); continue; }
    if(bessMWh<=1e-6 || bessMW<=1e-6) continue;
    const crate = bessMW/bessMWh;
    if(crate < inp.b_cratemin-1e-9 || crate > inp.b_cratemax+1e-9) continue;
    bessCombos.push({bessMW, bessMWh});
  }
  if(bessCombos.length===0) bessCombos.push({bessMW:0, bessMWh:0});
  const seenZero = bessCombos.filter(c=>c.bessMW<=1e-9&&c.bessMWh<=1e-9).length;
  const bessCombosFinal = seenZero<=1 ? bessCombos : [bessCombos.find(c=>c.bessMW<=1e-9&&c.bessMWh<=1e-9), ...bessCombos.filter(c=>!(c.bessMW<=1e-9&&c.bessMWh<=1e-9))];
  const topK = [];
  const considerForTopK = (ev, score) => { topK.push({ev, score}); topK.sort((a,b)=>b.score-a.score); if(topK.length>topKCount) topK.length = topKCount; };
  for(const solarMW of solarOpts) for(const windMW of windOpts) for(const oaMW of oaOpts) for(const gcMW of gcOpts) for(const bc of bessCombosFinal){
    const candidate = {solarMW, windMW, bessMW:bc.bessMW, bessMWh:bc.bessMWh, oaMW, gcMW};
    const ev = evaluateCandidateSteadyState(inp, units, baseDemand8760, candidate, gridCapMW);
    considerForTopK(ev, scoreCandidateEval(ev, inp));
  }
  if(topK.length===0){
    const zeroEv = evaluateCandidateSteadyState(inp, units, baseDemand8760, {solarMW:0,windMW:0,bessMW:0,bessMWh:0,oaMW:0,gcMW:0}, gridCapMW);
    topK.push({ev:zeroEv, score:scoreCandidateEval(zeroEv, inp)});
  }
  const refined = topK.map(item=>{
    const finExact = computeExactMultiYearFinancing(inp, units, baseDemand8760, item.ev.candidate, gridCapMW);
    const exactScore = scoreExactCandidate(item.ev, finExact, inp);
    return {ev:item.ev, coarseScore:item.score, finExact, exactScore};
  });
  refined.sort((a,b)=>b.exactScore-a.exactScore);
  return refined.map(r=>({ name:architectureNameOf(r.ev), ev:r.ev, finExact:r.finExact, score:r.exactScore }));
}

/* ---------------- BESS value sweep (Architecture / Economics helper) ---------------- */
function bessSweep8760(inp, units, baseDemand8760, gridCapMW, fixedCandidate){
  const mwhSteps = (()=>{ const arr=[]; const step=Math.max(inp.b_maxmwh/8,0.5); for(let v=0; v<=inp.b_maxmwh+1e-9; v+=step) arr.push(v); return arr; })();
  const crateOpts = [inp.b_cratemin, (inp.b_cratemin+inp.b_cratemax)/2, inp.b_cratemax];
  const results = [];
  const withoutCandidate = {...fixedCandidate, bessMW:0, bessMWh:0};
  const {result: withoutR} = runCandidateDispatch(inp, units, baseDemand8760, withoutCandidate, 1.0, gridCapMW, false);
  const gridRateWithout = gridRatePerKWh(inp, withoutR.annual.grid, withoutR.peakGridMW);
  const annualGridCostWithoutCr = withoutR.annual.grid*1000*gridRateWithout/1e7;
  mwhSteps.forEach(mwh=>{
    let bestForMWh=null;
    const crateList = mwh<=1e-6 ? [0] : crateOpts;
    crateList.forEach(crate=>{
      const bessMW = mwh<=1e-6? 0 : clampV(mwh*crate,0,inp.b_maxmw);
      const cand = {...fixedCandidate, bessMW, bessMWh:mwh};
      const {result} = runCandidateDispatch(inp, units, baseDemand8760, cand, 1.0, gridCapMW, false);
      const gridRate = gridRatePerKWh(inp, result.annual.grid, result.peakGridMW);
      const annualGridCostWithCr = result.annual.grid*1000*gridRate/1e7;
      const grossAvoidedCr = annualGridCostWithoutCr-annualGridCostWithCr;
      const capexCr = mwh*inp.b_capex*scenMult(inp).bess + bessMW*inp.b_capex_mw*scenMult(inp).bess;
      const annualCapexCr = capexCr*crf(inp.f_hurdle,10);
      const omCr = capexCr*(inp.b_om/100);
      const netValueCr = grossAvoidedCr-annualCapexCr-omCr;
      if(!bestForMWh || netValueCr>bestForMWh.netValueCr) bestForMWh = {mwh, bessMW, grossValueCr:grossAvoidedCr, annualCapexCr:annualCapexCr+omCr, netValueCr, annualShiftedMWh:result.annual.bessDischarge, unservedWith:result.annual.unserved};
    });
    results.push(bestForMWh);
  });
  let best = results[0]; results.forEach(r=>{ if(r.netValueCr>best.netValueCr) best=r; });
  return {results, best, withoutAnnual:withoutR.annual, annualGridCostWithoutCr};
}

function svgEl(tag, attrs, children){
  let s = `<${tag} `;
  for(const k in attrs) s += `${k}="${attrs[k]}" `;
  s += children!=null ? `>${children}</${tag}>` : '/>';
